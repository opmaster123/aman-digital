      title: "🔄 تم تحديث المتابعة الشهرية بنجاح",
      description: `تم تمديد موعد المتابعة لـ (${clientName}) لثلاثين يوماً قادمة.`
    });
  };

  const handleExportStatementExcel = () => {
    const headers = [
      "اسم العميل",
      "المدينة",
      "رقم الفاتورة",
      "المبلغ (ر.س)",
      "تاريخ التعاقد",
      "نوع العمل المنفذ",
      "تاريخ المتابعة الشهرية",
      "تاريخ تجديد الترخيص",
      "حالة السداد",
      "المهندس المشرف",
      "ملاحظات"
    ];

    const rows = filteredCustomerStatements.map((i) => [
      `"${i.clientName}"`,
      `"${i.city}"`,
      `"${i.invoiceNumber}"`,
      i.amountSar,
      `"${i.date}"`,
      `"${i.scopeOfWork}"`,
      `"${i.monthlyFollowupDate}"`,
      `"${i.licenseRenewalDate}"`,
      `"${i.paymentStatusAr}"`,
      `"${i.assignedEngineer || "م. فهد القحطاني"}"`,
      `"${i.notes}"`
    ]);

    const csvContent = "\uFEFF" + [headers.join(","), ...rows.map((e) => e.join(","))].join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `بيان_عملاء_وقايتي_${new Date().toISOString().split("T")[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    toast({
      title: "📥 تم تصدير بيان العملاء بنجاح",
      description: "تم تنزيل ملف CSV المعتمد متضمناً كافة الحقول والجداول."
    });
  };

  const handlePrintStatement = () => {
    window.print();
  };

  return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex select-none">
      {/* ========================================================= */}
      {/* 1. RIGHT SIDEBAR (شريط جانبي للصفحات الرئيسية) */}
      {/* ========================================================= */}
      {/* Mobile Backdrop */}
      {mobileMenuOpen && (
        <div 
          onClick={() => setMobileMenuOpen(false)} 
          className="fixed inset-0 bg-slate-900/40 z-40 lg:hidden backdrop-blur-xs transition-opacity"
        />
      )}

      <aside className={`fixed top-0 bottom-0 right-0 z-50 bg-white border-l border-slate-200/90 flex flex-col transition-all duration-300 shadow-sm lg:static lg:h-screen lg:sticky ${
        mobileMenuOpen ? "translate-x-0" : "translate-x-full lg:translate-x-0"
      } ${sidebarCollapsed ? "lg:w-20" : "lg:w-72 w-72"}`}>
        {/* Sidebar Brand Header */}
        <div className="p-4 border-b border-slate-100 flex items-center justify-between gap-2">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-700 shadow-xs shrink-0">
              <Flame className="w-5 h-5 text-emerald-600" />
            </div>
            {!sidebarCollapsed && (
              <div className="truncate">
                <div className="flex items-center gap-1.5">
                  <h1 className="font-bold text-slate-900 text-sm tracking-tight truncate">أمان ديجيتال برو</h1>
                  <span className="px-1.5 py-0.5 text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 rounded">
                    SBC 801
                  </span>
                </div>
                <p className="text-[11px] text-slate-400 font-medium truncate">أنظمة الأمن والسلامة المعتمدة</p>
              </div>
            )}
          </div>
          <button
            onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
            className="hidden lg:flex p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
            title={sidebarCollapsed ? "توسيع القائمة الجانبية" : "طي القائمة الجانبية"}
          >
            <ChevronRight className={`w-4 h-4 transition-transform duration-200 ${sidebarCollapsed ? "rotate-180" : ""}`} />
          </button>
          <button
            onClick={() => setMobileMenuOpen(false)}
            className="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100"
          >
            <X className="w-4 h-4" />
          </button>
        </div>

        {/* Global Facility Selector in Sidebar */}
        {!sidebarCollapsed ? (
          <div className="p-3 border-b border-slate-100 bg-slate-50/50">
            <div className="flex items-center justify-between gap-1 mb-1.5">
              <span className="text-[11px] font-semibold text-slate-500 flex items-center gap-1">
                <Building2 className="w-3.5 h-3.5 text-emerald-600" />
                <span>المنشأة المستهدفة:</span>
              </span>
              {selectedGlobalClient !== "all" && (
                <button
                  onClick={() => setSelectedGlobalClient("all")}
                  className="text-[10px] text-rose-600 hover:underline font-semibold"
                >
                  الكل
                </button>
              )}
            </div>
            <select
              aria-label="تصفح المنشأة"
              value={selectedGlobalClient}
              onChange={(e) => setSelectedGlobalClient(e.target.value)}
              className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-500 shadow-2xs"
            >
              <option value="all">🌐 كافة المنشآت (شامل 360°)</option>
              {customerStatements.map((c) => (
                <option key={c.id} value={c.clientName}>
                  {c.clientName}
                </option>
              ))}
            </select>
          </div>
        ) : (
          <div className="p-2 border-b border-slate-100 flex justify-center">
            <button
              onClick={() => setSidebarCollapsed(false)}
              className="p-2 text-slate-500 hover:text-emerald-700 rounded-lg hover:bg-slate-50"
              title="اختيار المنشأة"
            >
              <Building2 className="w-4 h-4" />
            </button>
          </div>
        )}

        {/* Sidebar Navigation Items */}
        <div className="flex-1 overflow-y-auto px-2.5 py-3 space-y-4 scrollbar-thin">
          {/* Section 1: Operations */}
          <div>
            {!sidebarCollapsed && (
              <p className="px-2.5 pb-1.5 text-[11px] font-bold text-slate-400 tracking-wider">العمليات والتقارير</p>
            )}
            <nav className="space-y-1">
              <button
                onClick={() => { setActiveTab("reports_hub"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "reports_hub"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="مركز التقارير وبيان العملاء"
              >
                <FileSpreadsheet className="w-4 h-4 text-emerald-600 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">بيان العملاء والتقارير</span>
                    <span className="bg-emerald-100/80 text-emerald-800 px-1.5 py-0.5 rounded text-[10px] font-mono font-bold">
                      {filteredCustomerStatements.length}
                    </span>
                  </>
                )}
              </button>

              <button
                onClick={() => { setActiveTab("pipeline_flow"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "pipeline_flow"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="شريط تدفق العمليات (Pipeline 360°)"
              >
                <Layers className="w-4 h-4 text-amber-600 shrink-0" />
                {!sidebarCollapsed && <span className="truncate flex-1 text-right">تدفق العمليات (Pipeline)</span>}
              </button>

              <button
                onClick={() => { setActiveTab("compliance"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "compliance"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="محرك التراخيص والامتثال (سلامة)"
              >
                <ShieldCheck className="w-4 h-4 text-emerald-600 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">التراخيص ومنصة سلامة</span>
                    {cstStats.expiringLicenses > 0 && (
                      <span className="bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded-full text-[10px] font-bold">
                        {cstStats.expiringLicenses}
                      </span>
                    )}
                  </>
                )}
              </button>

              <button
                onClick={() => { setActiveTab("field_crew"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "field_crew"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="الفرق الميدانية وأوامر العمل"
              >
                <HardHat className="w-4 h-4 text-amber-600 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">أوامر العمل والفرق الميدانية</span>
                    <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded text-[10px] font-mono">
                      {filteredWorkOrders.length}
                    </span>
                  </>
                )}
              </button>
            </nav>
          </div>

          {/* Section 2: Governance & Internal Audit */}
          <div>
            {!sidebarCollapsed && (
              <p className="px-2.5 pb-1.5 text-[11px] font-bold text-slate-400 tracking-wider">الرقابة والمراجعة الداخلية</p>
            )}
            <nav className="space-y-1">
              <button
                onClick={() => { setActiveTab("internal_audit_hub"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "internal_audit_hub"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="المراجعة الداخلية والمراحل الخمس (IIA)"
              >
                <Scale className="w-4 h-4 text-emerald-700 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">المراجعة الداخلية (IIA)</span>
                    <span className="bg-rose-100 text-rose-800 px-1.5 py-0.5 rounded text-[10px] font-bold">
                      {auditStats.highRisks} مخاطر
                    </span>
                  </>
                )}
              </button>

              <button
                onClick={() => { setActiveTab("restructure_ops_sops"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "restructure_ops_sops"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="الهيكلة والتنظيم والـ SOPs"
              >
                <FolderKanban className="w-4 h-4 text-blue-600 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">الهيكلة والـ SOPs (10 إدارات)</span>
                    <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded text-[10px] font-mono">
                      {safetySOPs.length}
                    </span>
                  </>
                )}
              </button>

              <button
                onClick={() => { setActiveTab("department_kpis"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "department_kpis"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="مؤشرات أداء الإدارات (KPIs)"
              >
                <Target className="w-4 h-4 text-amber-600 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">مؤشرات الأداء (KPIs)</span>
                    <span className="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded text-[10px] font-bold">
                      {auditStats.avgKpiAchievement}%
                    </span>
                  </>
                )}
              </button>
            </nav>
          </div>

          {/* Section 3: Engineering & Pricing */}
          <div>
            {!sidebarCollapsed && (
              <p className="px-2.5 pb-1.5 text-[11px] font-bold text-slate-400 tracking-wider">المشاريع والتسعير</p>
            )}
            <nav className="space-y-1">
              <button
                onClick={() => { setActiveTab("projects_submittals"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "projects_submittals"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="الاعتمادات والمخططات (Shop Drawings)"
              >
                <FileCode className="w-4 h-4 text-blue-600 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="truncate flex-1 text-right">المخططات والاعتمادات</span>
                    <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded text-[10px] font-mono">
                      {filteredSubmittals.length}
                    </span>
                  </>
                )}
              </button>

              <button
                onClick={() => { setActiveTab("inventory"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "inventory"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="المخزون والمواد المعتمدة (UL/FM)"
              >
                <Boxes className="w-4 h-4 text-slate-600 shrink-0" />
                {!sidebarCollapsed && <span className="truncate flex-1 text-right">المخزون والمواد (UL/FM)</span>}
              </button>

              <button
                onClick={() => { setActiveTab("crm_proposals"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "crm_proposals"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="حاسبة كود SBC 801 وعروض الأسعار"
              >
                <Calculator className="w-4 h-4 text-emerald-600 shrink-0" />
                {!sidebarCollapsed && <span className="truncate flex-1 text-right">حاسبة تسعير SBC 801</span>}
              </button>

              <button
                onClick={() => { setActiveTab("client_portal"); setMobileMenuOpen(false); }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                  activeTab === "client_portal"
                    ? "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200/80 shadow-2xs"
                    : "text-slate-600 hover:bg-slate-100/80 hover:text-slate-900"
                } ${sidebarCollapsed ? "justify-center px-0" : ""}`}
                title="بوابة العميل وشهادات السلامة"
              >
                <QrCode className="w-4 h-4 text-emerald-600 shrink-0" />
                {!sidebarCollapsed && <span className="truncate flex-1 text-right">بوابة العميل والشهادات</span>}
              </button>
            </nav>
          </div>
        </div>

        {/* Sidebar Footer Info */}
        {!sidebarCollapsed && (
          <div className="p-3 border-t border-slate-100 bg-slate-50/60 text-[11px] text-slate-500">
            <div className="flex items-center justify-between font-medium">
              <span>الدفاع المدني & سلامة</span>
              <span className="text-emerald-700 font-bold">100% مطابق</span>
            </div>
            <p className="text-[10px] text-slate-400 mt-0.5">نظام التشغيل الرقمي المعتمد 360°</p>
          </div>
        )}
      </aside>

      {/* ========================================================= */}
      {/* 2. MAIN CONTENT AREA (المحتوى الرئيسي) */}
      {/* ========================================================= */}
      <div className="flex-1 min-w-0 flex flex-col min-h-screen overflow-x-hidden">
        {/* Top Header Bar */}
        <header className="bg-white border-b border-slate-200/90 shadow-2xs sticky top-0 z-30">
          <div className="px-4 md:px-6 py-3 flex items-center justify-between gap-4">
            {/* Mobile Menu Button & Active Tab Title */}
            <div className="flex items-center gap-3">
              <button
                onClick={() => setMobileMenuOpen(true)}
                className="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors"
                aria-label="فتح القائمة الجانبية"
              >
                <Menu className="w-5 h-5" />
              </button>

              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-base md:text-lg font-bold text-slate-900 tracking-tight">
                    {tabMetadata[activeTab]?.title || "أمان ديجيتال برو لأنظمة الأمن والسلامة"}
                  </h2>
                  <span className="hidden sm:inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    كود SBC 801
                  </span>
                </div>
                <p className="text-xs text-slate-500 font-medium hidden sm:block">
                  {tabMetadata[activeTab]?.subtitle || "نظام التشغيل الرقمي والمراجعة الداخلية لخدمات وتراخيص الدفاع المدني"}
                </p>
              </div>
            </div>

            {/* Quick Actions in Header */}
            <div className="flex items-center gap-2">
              <button
                onClick={handleExportStatementExcel}
                className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors"
                title="تصدير بيان العملاء إلى CSV"
              >
                <Download className="w-3.5 h-3.5" />
                <span>تصدير CSV</span>
              </button>

              <button
                onClick={handlePrintStatement}
                className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors"
                title="طباعة التقرير"
              >
                <Printer className="w-3.5 h-3.5" />
                <span>طباعة</span>
              </button>

              <button
                onClick={() => setActiveTab("crm_proposals")}
                className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-xs transition-all"
              >
                <Calculator className="w-3.5 h-3.5" />
                <span className="hidden xs:inline">حاسبة</span>
                <span>SBC 801</span>
              </button>
            </div>
          </div>

          {/* Global Focus Banner when filtering by single client */}
          {selectedGlobalClient !== "all" && (
            <div className="bg-emerald-50 border-t border-emerald-200/80 py-2 px-4 md:px-6">
              <div className="flex items-center justify-between text-xs flex-wrap gap-2">
                <div className="flex items-center gap-2">
                  <Zap className="w-4 h-4 text-emerald-700 shrink-0" />
                  <span className="font-semibold text-emerald-900">الرؤية المترابطة مفعلة للمنشأة:</span>
                  <span className="font-bold text-slate-900 bg-white px-2 py-0.5 rounded border border-emerald-300">
                    {selectedGlobalClient}
                  </span>
                  <span className="text-emerald-700/80 hidden md:inline">
                    (كافة التبويبات والمشاريع وأوامر العمل والمخزون مفلترة تلقائياً)
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setSelectedDossierClient(selectedGlobalClient)}
                    className="px-2.5 py-1 bg-emerald-700 text-white hover:bg-emerald-800 rounded text-xs font-semibold flex items-center gap-1 shadow-2xs"
                  >
                    <Eye className="w-3 h-3" />
                    <span>فتح الملف الشامل 360°</span>
                  </button>
                  <button
                    onClick={() => setSelectedGlobalClient("all")}
                    className="px-2 py-1 bg-white hover:bg-slate-50 rounded text-xs border border-slate-200 text-slate-600 font-medium"
                  >
                    عرض كل المنشآت
                  </button>
                </div>
              </div>
            </div>
          )}
        </header>

        {/* Tab Content Wrapper */}
        <div className="flex-1 p-4 md:p-6 pb-20">
{/* 3. MAIN CONTENT CONTAINER */}
      {/* ========================================================= */}
      <main className="space-y-6">
        {/* ========================================================= */}
        {/* TAB 1: REPORTS & CUSTOMER STATEMENTS HUB (التركيز الأساسي) */}
        {/* ========================================================= */}
        {activeTab === "reports_hub" && (
          <div className="space-y-6">
            {/* Sub Tabs Selector & Top Action Bar */}
            <div className="flex flex-wrap items-center justify-between gap-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
              <div className="flex items-center gap-2">
                <button

                  </span>

                <button
                  onClick={() => setReportsSubTab("monthly_reports")}

                      : "bg-slate-100 text-slate-600 hover:text-slate-900"
                  }`}

                  <BarChart3 className="w-4 h-4" />
                  <span>التقارير الشهرية التنفيذية الشاملة</span>
                </button>
              </div>

              {/* Action Buttons for Export & Add */}
              <div className="flex items-center gap-2">

                    <button
                      onClick={handleExportStatementExcel}

                      <Download className="w-3.5 h-3.5 text-emerald-700" />
                      <span>تصدير Excel / CSV</span>
                    </button>

                    <button
                      onClick={handlePrintStatement}
                      className="px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all"
                    >
                      <Printer className="w-3.5 h-3.5 text-slate-600" />
                      <span>طباعة رسمية PDF</span>
                    </button>

                    <button
                      onClick={() => setIsAddCustomerModalOpen(true)}
                      className="px-3.5 py-1.5 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all"
                    >
                      <Plus className="w-4 h-4" />
                      <span>إضافة عميل / عقد جديد</span>
                    </button>
                  </>
                )}

                {reportsSubTab === "daily_reports" && (
                  <button
                    onClick={() => setIsNewDailyReportModalOpen(true)}
                    className="px-3.5 py-1.5 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all"
                  >
                    <Plus className="w-4 h-4" />
                    <span>تسجيل تقرير ميداني يومي</span>
                  </button>
                )}
              </div>
            </div>

            {/* SUB-TAB 1: CUSTOMER STATEMENT REGISTRY (بيان العملاء) */}
            {reportsSubTab === "customer_statement" && (
              <div className="space-y-6">
                {/* Refined KPI Metrics Cards (ألوان هادئة ومريحة للعين) */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {/* Card 1: Total Value */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-slate-300 transition-all">
                    <div className="flex items-center justify-between">
                      <p className="text-xs font-semibold text-slate-500">إجمالي قيمة بيان العملاء</p>
                      <div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center border border-emerald-100">
                        <DollarSign className="w-4 h-4" />
                      </div>
                    </div>
                    <p className="text-2xl font-extrabold mt-2 text-slate-900 tracking-tight">
                      {cstStats.totalAmount.toLocaleString()} <span className="text-xs font-normal text-slate-500">ر.س</span>
                    </p>
                    <p className="text-xs text-slate-500 mt-1">عقود توريد وتركيب وصيانة معتمدة</p>
                  </div>

                  {/* Card 2: Due Followups */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-slate-300 transition-all">
                    <div className="flex items-center justify-between">
                      <p className="text-xs font-semibold text-slate-500">متابعات شهرية مستحقة</p>
                      <div className="w-8 h-8 rounded-lg bg-amber-50 text-amber-700 flex items-center justify-center border border-amber-100">
                        <Clock className="w-4 h-4" />
                      </div>
                    </div>
                    <div className="flex items-baseline gap-2 mt-2">
                      <span className="text-2xl font-extrabold text-amber-700">{cstStats.dueSoonFollowups}</span>
                      <span className="text-xs text-slate-500">خلال أسبوع</span>
                      {cstStats.overdueFollowups > 0 && (
                        <span className="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 mr-auto">
                          {cstStats.overdueFollowups} متأخرة
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-slate-500 mt-1">فحص المضخات ولوحات الإنذار الدورية</p>
                  </div>

                  {/* Card 3: Expiring Licenses */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-slate-300 transition-all">
                    <div className="flex items-center justify-between">
                      <p className="text-xs font-semibold text-slate-500">تراخيص دفاع مدني قاربت على الانتهاء</p>
                      <div className="w-8 h-8 rounded-lg bg-rose-50 text-rose-700 flex items-center justify-center border border-rose-100">
                        <ShieldAlert className="w-4 h-4" />
                      </div>
                    </div>
                    <p className="text-2xl font-extrabold mt-2 text-rose-700">{cstStats.expiringLicenses}</p>
                    <p className="text-xs text-slate-500 mt-1">تتطلب رفع تقرير سلامة فوري للوقاية من الغرامات</p>
                  </div>

                  {/* Card 4: Compliance Rate */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-slate-300 transition-all">
                    <div className="flex items-center justify-between">
                      <p className="text-xs font-semibold text-slate-500">نسبة الامتثال والربط عبر الإدارات</p>
                      <div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center border border-emerald-100">
                        <CheckCircle2 className="w-4 h-4" />
                      </div>
                    </div>
                    <p className="text-2xl font-extrabold mt-2 text-emerald-700">100%</p>
                    <p className="text-xs text-slate-500 mt-1">ربط حي بين المخزون، الفرق، والمشاريع</p>
                  </div>
                </div>

                      <Search className="w-4 h-4 absolute right-3 top-3 text-slate-400" />
                      <input
                        type="text"
                        placeholder="البحث باسم العميل، نوع العمل، رقم الفاتورة، أو رقم الجوال..."
                        value={cstSearchQuery}
                        onChange={(e) => setCstSearchQuery(e.target.value)}
                        className="w-full bg-slate-50/70 border border-slate-200 rounded-lg pr-9 pl-3 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800"
                      />
                    </div>

                    <div>
                      <select
                        aria-label="تصفية حسب المدينة"
                        value={cstCityFilter}
                        onChange={(e) => setCstCityFilter(e.target.value)}

                        <option value="all">📍 كافة المدن (الرياض، جدة، الدمام)</option>
                        <option value="الرياض">الرياض</option>
                        <option value="جدة">جدة</option>
                        <option value="الدمام">الدمام</option>
                      </select>
                    </div>

                    <div>
                      <select
                        aria-label="تصفية حسب موعد المتابعة الشهرية"
                        value={cstFollowupFilter}
                        onChange={(e) => setCstFollowupFilter(e.target.value)}
                        className="w-full bg-slate-50/70 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800"
                      >
                        <option value="all">⏰ كافة حالات المتابعة الشهرية</option>
                        <option value="due_soon">تستحق قريباً (خلال 7 أيام)</option>
                        <option value="overdue">متأخرة عن الموعد</option>
                        <option value="upcoming">مجدولة لاحقاً</option>
                      </select>
                    </div>
                  </div>
                </div>

                          <th className="p-3.5">#</th>
                          <th className="p-3.5">اسم العميل والمنشأة</th>
                          <th className="p-3.5">التاريخ</th>
                          <th className="p-3.5">المبلغ الإجمالي</th>
                          <th className="p-3.5">نوع العمل المنفذ</th>
                          <th className="p-3.5">تاريخ المتابعة الشهرية</th>
                          <th className="p-3.5">تاريخ تجديد الترخيص</th>
                          <th className="p-3.5 text-center">إنجاز الإدارات</th>
                          <th className="p-3.5 text-center">الإجراءات المترابطة</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredCustomerStatements.length === 0 ? (
                          <tr>
                            <td colSpan={9} className="p-8 text-center text-slate-400">

                            </td>
                          </tr>
                        ) : (
                          filteredCustomerStatements.map((item, idx) => {
                            const isOverdue = item.followupUrgency === "overdue";
                            const isDueSoon = item.followupUrgency === "due_soon";
                            const isLicExpiring = item.licenseUrgency === "expiring_soon";

                            return (
                              <tr
                                key={item.id}
                                className="hover:bg-slate-50/80 transition-colors group cursor-pointer"
                                onClick={() => setSelectedDossierClient(item.clientName)}
                              >
                                <td className="p-3.5 text-slate-400 font-mono">{idx + 1}</td>

                                <td className="p-3.5">
                                  <div className="font-bold text-slate-900 group-hover:text-emerald-700 transition-colors flex items-center gap-1.5">
                                    <Building2 className="w-3.5 h-3.5 text-slate-400" />
                                    <span>{item.clientName}</span>
                                  </div>
                                  <div className="text-xs text-slate-500 flex items-center gap-2 mt-0.5 font-medium">
                                    <span>📍 {item.city}</span>
                                    <span>•</span>
                                    <span>📞 {item.phone}</span>
                                    <span>•</span>
                                    <span className="font-mono">{item.invoiceNumber}</span>
                                  </div>
                                </td>

                                <td className="p-3.5 text-slate-700 whitespace-nowrap font-mono">{item.date}</td>

                                <td className="p-3.5 whitespace-nowrap">
                                  <div className="font-extrabold text-slate-900">
                                    {item.amountSar.toLocaleString()} <span className="text-xs font-normal text-slate-500">ر.س</span>
                                  </div>
                                  <span
                                    className={`inline-flex items-center px-1.5 py-0.5 rounded text-xs font-semibold mt-0.5 border ${
                                      item.paymentStatus === "paid"
                                        ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                        : "bg-amber-50 text-amber-800 border-amber-200"
                                    }`}
                                  >
                                    {item.paymentStatusAr}
                                  </span>
                                </td>

                                <td className="p-3.5 max-w-xs">
                                  <p className="text-slate-800 line-clamp-2 leading-relaxed font-normal">{item.scopeOfWork}</p>
                                  {item.assignedEngineer && (
                                    <span className="text-xs text-emerald-700 font-semibold block mt-0.5">
                                      👤 المشرف: {item.assignedEngineer}
                                    </span>
                                  )}
                                </td>

                                <td className="p-3.5 whitespace-nowrap">
                                  <div className="flex items-center gap-1.5 font-mono font-bold">
                                    <Calendar className="w-3.5 h-3.5 text-slate-400" />
                                    <span
                                      className={
                                        isOverdue
                                          ? "text-rose-700 font-bold"
                                          : isDueSoon
                                          ? "text-amber-700 font-bold"
                                          : "text-slate-800"
                                      }
                                    >
                                      {item.monthlyFollowupDate}
                                    </span>
                                  </div>
                                  {isOverdue && (
                                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 mt-1">
                                      ⚠️ متأخرة عن الموعد!
                                    </span>
                                  )}
                                  {isDueSoon && (
                                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200 mt-1">
                                      🔔 خلال 7 أيام
                                    </span>
                                  )}
                                </td>

                                <td className="p-3.5 whitespace-nowrap">
                                  <div className="flex items-center gap-1.5 font-mono font-bold">
                                    <Shield className="w-3.5 h-3.5 text-slate-400" />
                                    <span className={isLicExpiring ? "text-rose-700 font-bold" : "text-slate-800"}>
                                      {item.licenseRenewalDate}
                                    </span>
                                  </div>
                                  {isLicExpiring && (
                                    <span className="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 mt-1">
                                      🛡️ قارب على الانتهاء
                                    </span>
                                  )}
                                </td>

                                <td className="p-3.5 text-center">
                                  <div className="w-20 mx-auto">
                                    <div className="flex justify-between text-xs mb-1 font-mono text-slate-600">
                                      <span>إنجاز</span>
                                      <span className="font-bold">{item.completionPercentage || 100}%</span>
                                    </div>
                                    <Progress value={item.completionPercentage || 100} className="h-1.5 bg-slate-100" />
                                  </div>
                                </td>

                                <td className="p-3.5" onClick={(e) => e.stopPropagation()}>
                                  <div className="flex items-center justify-center gap-1.5">
                                    <button
                                      onClick={() => setSelectedDossierClient(item.clientName)}
                                      className="p-1.5 hover:bg-emerald-50 hover:text-emerald-700 rounded-md text-slate-500 transition-colors"
                                      title="فتح الملف المؤسسي 360°"
                                    >
                                      <Eye className="w-4 h-4" />
                                    </button>

                                    <button
                                      onClick={() => handleMarkFollowupDone(item.id, item.clientName)}
                                      className="p-1.5 hover:bg-emerald-50 hover:text-emerald-700 rounded-md text-slate-500 transition-colors"
                                      title="تأكيد إنجاز المتابعة وتمديد 30 يوم"
                                    >
                                      <RefreshCw className="w-4 h-4" />
                                    </button>

                                    <button
                                      onClick={() => {
                                        setSelectedGlobalClient(item.clientName);
                                        setActiveTab("field_crew");
                                      }}
                                      className="p-1.5 hover:bg-amber-50 hover:text-amber-700 rounded-md text-slate-500 transition-colors"
                                      title="توجيه أمر عمل ميداني"
                                    >
                                      <HardHat className="w-4 h-4" />
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* SUB-TAB 2: DAILY FIELD REPORTS (GPS & COMPLIANCE) */}
            {reportsSubTab === "daily_reports" && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {filteredDailyReports.map((rep) => (
                    <div key={rep.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div>
                          <span className="font-mono text-xs text-emerald-700 font-bold">{rep.reportNumber}</span>
                          <h4 className="font-bold text-sm text-slate-900">{rep.projectName}</h4>
                        </div>
                        <span
                          className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold border ${
                            rep.status === "approved"
                              ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                              : "bg-amber-50 text-amber-800 border-amber-200"
                          }`}
                        >
                          {rep.status === "approved" ? "معتمد وموثق" : "قيد المراجعة"}
                        </span>
                      </div>

                      <div className="text-xs space-y-1.5 text-slate-600">
                        <div className="flex items-center gap-1.5">
                          <Building2 className="w-3.5 h-3.5 text-emerald-700" />
                          <span className="font-semibold text-slate-900">{rep.clientName}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <Users className="w-3.5 h-3.5 text-slate-400" />
                          <span>
                            {rep.supervisorName} | {rep.technicianName}
                          </span>
                        </div>
                        <div className="flex items-center gap-1.5 font-mono text-xs text-slate-500">
                          <MapPin className="w-3.5 h-3.5 text-rose-600" />
                          <span>{rep.gpsCoordinates}</span>
                        </div>
                      </div>

                      <div className="bg-slate-50 p-3 rounded-lg text-xs space-y-1.5 border border-slate-100">
                        <p className="font-semibold text-slate-800">الأعمال المنفذة اليوم:</p>
                        <ul className="list-disc list-inside space-y-0.5 text-slate-600 text-xs">
                          {rep.scopeExecuted.map((s, idx) => (
                            <li key={idx}>{s}</li>
                          ))}
                        </ul>
                      </div>

                      {rep.hydrostaticPressurePsi && (
                        <div className="flex items-center justify-between bg-emerald-50/70 p-2 rounded border border-emerald-200/60 text-xs">
                          <span className="font-semibold text-slate-800">اختبار الضغط الهيدروستاتيكي:</span>
                          <span className="font-mono font-bold text-emerald-800">{rep.hydrostaticPressurePsi} PSI (ناجح)</span>
                        </div>
                      )}

                      <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-100 text-slate-500">
                        <span>📸 {rep.photosCount} صور موقعية</span>
                        <span className="font-semibold text-emerald-700">✓ مطابقة SBC 801</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SUB-TAB 3: MONTHLY EXECUTIVE REPORTS */}
            {reportsSubTab === "monthly_reports" && (
              <div className="space-y-6">
                {monthlyReports.map((mon) => (
                  <div key={mon.id} className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4">
                      <div>
                        <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                          التقرير التنفيذي الشامل
                        </span>
                        <h3 className="text-xl font-bold mt-1.5 text-slate-900">{mon.monthYear}</h3>
                        <p className="text-xs text-slate-500 mt-0.5">{mon.summaryText}</p>
                      </div>

                      <button
                        onClick={handlePrintStatement}
                        className="px-3.5 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm text-slate-700"
                      >
                        <Printer className="w-3.5 h-3.5 text-slate-600" />
                        <span>طباعة التقرير الشهري</span>
                      </button>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80">
                        <p className="text-xs text-slate-500">إجمالي الإيرادات</p>
                        <p className="text-xl font-extrabold text-slate-900 mt-1">{mon.totalRevenueSar.toLocaleString()} ر.س</p>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80">
                        <p className="text-xs text-slate-500">صافي الأرباح التشغيلية</p>
                        <p className="text-xl font-extrabold text-emerald-700 mt-1">{mon.netProfitSar.toLocaleString()} ر.س</p>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80">
                        <p className="text-xs text-slate-500">المشاريع المنجزة</p>

        {/* ========================================================= */}

                      } else if (stage.id === "STAGE-3") setActiveTab("projects_submittals");
                      else if (stage.id === "STAGE-4") setActiveTab("inventory");
                      else if (stage.id === "STAGE-5") setActiveTab("field_crew");
                      else if (stage.id === "STAGE-6") {

            </div>

        {/* TAB 3: COMPLIANCE & SALAMAH LICENSING ENGINE */}

                    <Shield className="w-5 h-5 text-emerald-700" />

                  </div>
                  <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">

                  </span>
                </div>

                <div className="space-y-3">
                  {civilDefenseLicenses.map((lic) => (
                    <div key={lic.id} className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">

                        <span className="font-bold text-xs text-slate-900">{lic.facilityName}</span>
                        <span
                          className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold border ${
                            lic.status === "valid"
                              ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                              : "bg-rose-50 text-rose-700 border-rose-200"
                          }`}

                          {lic.statusAr}
                        </span>

                        <div>الانتهاء: {lic.expiryDate}</div>

                      <div className="text-xs text-slate-500 flex justify-between font-mono pt-1">
                        <span>الجهة: {cert.authority}</span>
                        <span className="font-semibold">باقي: {cert.daysRemaining} يوم</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

        {/* TAB: INTERNAL AUDIT & 5 EXECUTION PHASES (IIA CONFORMITY) */}

                    auditSubTab === "phases_overview"
                      ? "bg-emerald-700 text-white shadow-sm"
                      : "bg-slate-100 text-slate-600 hover:text-slate-900"
                  }`}
                >
                  <Layers className="w-4 h-4" />
                  <span>المراحل التنفيذية الخمس (0 إلى 4)</span>
                </button>

                  onClick={() => setAuditSubTab("risk_register")}
                  className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${
                    auditSubTab === "risk_register"
                      ? "bg-emerald-700 text-white shadow-sm"
                      : "bg-slate-100 text-slate-600 hover:text-slate-900"
                  }`}
                >
                  <ShieldAlertIcon className="w-4 h-4" />
                  <span>سجل المخاطر المؤسسي الشامل</span>
                  <span className="bg-white/20 px-1.5 py-0.2 rounded text-xs">
                    {filteredRisks.length}
                  </span>
                </button>

                <button
                  onClick={() => setAuditSubTab("audit_programs")}
                  className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${
                    auditSubTab === "audit_programs"
                      ? "bg-emerald-700 text-white shadow-sm"
                      : "bg-slate-100 text-slate-600 hover:text-slate-900"

                  <ClipboardCheck className="w-4 h-4" />

                  onClick={() => setAuditSubTab("capa_tracker")}

                    auditSubTab === "capa_tracker"

                      : "bg-slate-100 text-slate-600 hover:text-slate-900"

              </button>
            </div>

            {/* AUDIT SUB-TAB 1: 5 EXECUTION PHASES STEPPER */}

                <div className="grid grid-cols-1 md:grid-cols-5 gap-3">
                  {EXECUTION_PHASES_5.map((phase, idx) => {
                    const isSelected = selectedPhaseIndex === phase.phaseNumber;

                      <div
                        key={phase.id}
                        onClick={() => setSelectedPhaseIndex(phase.phaseNumber)}
                        className={`p-4 rounded-xl border transition-all cursor-pointer space-y-2 ${
                          isSelected
                            ? "bg-white border-emerald-500 shadow-md ring-1 ring-emerald-500"
                            : "bg-slate-50 hover:bg-white border-slate-200"

                      >
                        <div className="flex items-center justify-between">
                          <span
                            className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                              isSelected
                                ? "bg-emerald-700 text-white"
                                : "bg-slate-200 text-slate-700"

                          >
                            {phase.phaseNumber}
                          </span>
                          <span
                            className={`inline-flex items-center px-1.5 py-0.5 rounded text-xs font-semibold border ${
                              phase.status === "completed"
                                ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                : "bg-amber-50 text-amber-800 border-amber-200"

                            {phase.status === "completed" ? "مكتملة" : "قيد التشغيل"}

                        <h4 className="font-bold text-xs text-slate-900 leading-snug">{phase.title}</h4>
                        <p className="text-xs text-slate-500 line-clamp-2">{phase.subtitle}</p>
                        <div className="text-xs font-mono text-emerald-700 pt-1 border-t border-slate-100">
                          ⏱️ {phase.durationEstimate}
                        </div>
                      </div>

                {/* Selected Phase Detailed Dossier */}
                {(() => {

                    <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-6">
                      <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4">

                          <div className="flex items-center gap-2">
                            <h3 className="text-lg font-bold text-slate-900">{activePhase.title}</h3>
                            <span className="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                              {activePhase.iiaStandardRef}

                          </div>
                          <p className="text-xs text-slate-600 mt-1">{activePhase.subtitle}</p>
                        </div>
                        <div className="text-left text-xs text-slate-500 font-mono">
                          <div>المرجع التنظيمي: {activePhase.civilDefenseRef}</div>
                          <div className="font-semibold text-emerald-700 mt-0.5">المدة المقدرة: {activePhase.durationEstimate}</div>
                        </div>
                      </div>

                            <span>المعالم والأنشطة التنفيذية الرئيسية ({activePhase.milestones.length})</span>

                          <div className="space-y-2">
                            {activePhase.milestones.map((mil, i) => (
                              <div
                                key={i}
                                className="p-3 bg-slate-50 rounded-lg border border-slate-200/80 text-xs flex items-start gap-2.5"
                              >
                                <CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                                <span className="text-slate-800 font-medium leading-relaxed">{mil}</span>
                              </div>
                            ))}

                          <div className="p-4 bg-emerald-50/70 border border-emerald-200/80 rounded-xl mt-4 space-y-1.5">
                            <p className="font-bold text-xs text-emerald-900 flex items-center gap-1.5">
                              <Sparkles className="w-4 h-4 text-emerald-700" />
                              <span>تكامل المراجعة مع إعادة الهيكلة:</span>

                            <p className="text-xs text-emerald-800 leading-relaxed">

                            </p>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* AUDIT SUB-TAB 2: ENTERPRISE RISK REGISTER */}
            {auditSubTab === "risk_register" && (
              <div className="space-y-4">
                {/* Risk Filter Bar */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-slate-600 text-xs mb-1 font-semibold">تصفية حسب الإدارة:</label>
                    <select
                      value={riskDeptFilter}
                      onChange={(e) => setRiskDeptFilter(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                    >
                      <option value="all">🌐 كافة الإدارات الـ 10</option>

                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                    >
                      <option value="all">كافة مستويات الخطورة</option>
                      <option value="عالية">عالية (High Risk)</option>
                      <option value="متوسطة">متوسطة (Medium Risk)</option>

                    </select>
                  </div>

                    <div className="w-full bg-slate-50 p-2 rounded-lg border border-slate-200 text-xs flex items-center justify-between">

                      <span className="font-mono font-bold text-slate-900">{filteredRisks.length} مخاطر</span>

                          <th className="p-3.5">الضوابط الرقابية القائمة</th>
                          <th className="p-3.5">خطة العمل التصحيحية (CAPA)</th>
                          <th className="p-3.5 text-center">إجراء المعالجة</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredRisks.map((r) => {
                          const isHigh = r.severityLevel === "عالية";
                          return (
                            <tr key={r.id} className="hover:bg-slate-50/80 transition-colors">
                              <td className="p-3.5 font-mono font-bold text-emerald-700 whitespace-nowrap">{r.riskCode}</td>

                              <td className="p-3.5 max-w-xs">

                                <span
                                  className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-bold border ${

                              <td className="p-3.5 text-center whitespace-nowrap">

                                </button>
                              </td>
                            </tr>
                          );

                    </table>

                </div>

            {/* AUDIT SUB-TAB 3: INTERNAL AUDIT PROGRAMS */}
