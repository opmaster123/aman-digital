                  <h3 className="font-bold text-sm text-slate-900">بوابة العميل والجهات الرقابية (Client & Inspector Portal)</h3>
                </div>
                <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                  شهادات موثقة بـ QR Code
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {facilityBranches.map((br) => (
                  <div key={br.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="font-bold text-xs text-slate-900">{br.name}</h4>
                      <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                        جاهزية: {br.readinessPercentage}%
                      </span>
                    </div>

                    <div className="text-xs text-slate-600 space-y-1 font-mono">
                      <div>📍 {br.city} - {br.district} ({br.areaSqMeters} م²)</div>
                      <div>🛡️ رخصة الدفاع المدني: {br.civilDefenseLicenseStatus}</div>
                      <div>🔄 عقد الصيانة: {br.maintenanceContractStatus}</div>
                    </div>

                    <div className="pt-2 border-t border-slate-200 flex items-center justify-between text-xs">
                      <span className="text-xs text-slate-500">الزيارة القادمة: {br.nextVisitDate}</span>
                      <button
                        onClick={() => {
                          toast({
                            title: "📄 تم توليد شهادة السلامة الإلكترونية",
                            description: `شهادة الامتثال لـ (${br.name}) جاهزة برمز QR المعتمد.`
                          });
                        }}
                        className="px-2.5 py-1 bg-white hover:bg-slate-100 border border-slate-200 rounded text-xs font-semibold text-emerald-700 shadow-sm"
                      >
                        تحميل شهادة السلامة PDF
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </main>

      {/* ========================================================= */}
      {/* MODAL 1: 360° UNIFIED CLIENT DOSSIER (الملف الشامل المترابط) */}
      {/* ========================================================= */}
      {selectedDossierClient && activeUnifiedDossier && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
            {/* Header */}
            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-700 shadow-sm">
                  <Building2 className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="text-lg font-bold text-slate-900">{activeUnifiedDossier.clientStatement.clientName}</h3>
                    <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                      ملف مؤسسي موحد 360°
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    📍 {activeUnifiedDossier.clientStatement.city} • 📞 {activeUnifiedDossier.clientStatement.phone} • رقم الفاتورة:{" "}
                    {activeUnifiedDossier.clientStatement.invoiceNumber}
                  </p>
                </div>
              </div>

              <button
                onClick={() => setSelectedDossierClient(null)}
                className="p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-slate-600"
              >
                ✕
              </button>
            </div>

            {/* Cross Alerts */}
            {activeUnifiedDossier.activeAlerts.length > 0 && (
              <div className="bg-rose-50 border border-rose-200 p-3 rounded-xl space-y-1">
                <p className="font-bold text-xs text-rose-800 flex items-center gap-1.5">
                  <AlertTriangle className="w-4 h-4" />
                  <span>تنبيهات استباقية تستوجب إجراءً فورياً:</span>
                </p>
                <ul className="text-xs text-rose-700 space-y-0.5 list-disc list-inside">
                  {activeUnifiedDossier.activeAlerts.map((alt, i) => (
                    <li key={i}>{alt}</li>
                  ))}
                </ul>
              </div>
            )}

            {/* Quick Metrics */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500">قيمة التعاقد الإجمالية</p>
                <p className="text-base font-extrabold font-mono mt-0.5 text-slate-900">
                  {activeUnifiedDossier.clientStatement.amountSar.toLocaleString()} ر.س
                </p>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500">المتابعة الشهرية القادمة</p>
                <p className="text-base font-extrabold font-mono mt-0.5 text-emerald-700">
                  {activeUnifiedDossier.clientStatement.monthlyFollowupDate}
                </p>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500">تجديد رخصة الدفاع المدني</p>
                <p className="text-base font-extrabold font-mono mt-0.5 text-slate-900">
                  {activeUnifiedDossier.clientStatement.licenseRenewalDate}
                </p>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500">نسبة الامتثال الميداني</p>
                <p className="text-base font-extrabold font-mono mt-0.5 text-emerald-700">
                  {activeUnifiedDossier.overallComplianceScore}%
                </p>
              </div>
            </div>

            {/* Tabular Details from All Departments */}
            <div className="space-y-4">
              {/* 1. Engineering Submittals for this Client */}
              <div className="border border-slate-200 rounded-xl p-4 bg-white space-y-2">
                <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5">
                  <FileCode className="w-4 h-4 text-emerald-700" />
                  <span>الاعتمادات الهندسية والمخططات المرتبطة ({activeUnifiedDossier.submittals.length})</span>
                </h4>
                {activeUnifiedDossier.submittals.length === 0 ? (
                  <p className="text-xs text-slate-400">لا توجد اعتمادات هندسية مفتوحة حالياً.</p>
                ) : (
                  <div className="space-y-2">
                    {activeUnifiedDossier.submittals.map((s) => (
                      <div key={s.id} className="flex items-center justify-between text-xs p-2.5 bg-slate-50 rounded-lg border border-slate-100">
                        <div>
                          <span className="font-mono font-bold text-emerald-700">{s.submittalNumber}</span> - {s.type} ({s.systemCategory})
                        </div>
                        <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                          {s.statusAr}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* 2. Field Work Orders & Daily Reports */}
              <div className="border border-slate-200 rounded-xl p-4 bg-white space-y-2">
                <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5">
                  <HardHat className="w-4 h-4 text-amber-600" />
                  <span>أوامر العمل والتقارير الميدانية بالـ GPS ({activeUnifiedDossier.dailyReports.length})</span>
                </h4>
                {activeUnifiedDossier.dailyReports.length === 0 ? (
                  <p className="text-xs text-slate-400">لم يتم تسجيل تقارير يومية سابقة لهذا العميل.</p>
                ) : (
                  <div className="space-y-2">
                    {activeUnifiedDossier.dailyReports.map((r) => (
                      <div key={r.id} className="text-xs p-2.5 bg-slate-50 rounded-lg border border-slate-100 space-y-1">
                        <div className="flex justify-between font-bold text-slate-900">
                          <span>{r.reportNumber} ({r.date})</span>
                          <span className="text-emerald-700 font-mono">ضغط {r.hydrostaticPressurePsi || 200} PSI</span>
                        </div>
                        <p className="text-slate-600 text-xs">{r.scopeExecuted.join(" • ")}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* 3. Allocated Materials */}
              <div className="border border-slate-200 rounded-xl p-4 bg-white space-y-2">
                <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5">
                  <Boxes className="w-4 h-4 text-slate-700" />
                  <span>المواد والمعدات المعتمدة المصروفة للمنشأة</span>
                </h4>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                  {activeUnifiedDossier.allocatedMaterials.map((mat, idx) => (
                    <div key={idx} className="p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                      <p className="font-bold text-slate-900 text-xs">{mat.name}</p>
                      <p className="text-slate-500 text-xs font-mono mt-0.5">
                        الكمية: {mat.quantity} • {mat.status}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Cross-Department Action Buttons */}
            <div className="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <button
                  onClick={() => {
                    handleMarkFollowupDone(activeUnifiedDossier.clientStatement.id, activeUnifiedDossier.clientStatement.clientName);
                  }}
                  className="px-3.5 py-2 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm"
                >
                  <RefreshCw className="w-3.5 h-3.5" />
                  <span>تحديث المتابعة الشهرية (+30 يوم)</span>
                </button>

                <button
                  onClick={() => {
                    setSelectedDossierClient(null);
                    setSelectedGlobalClient(activeUnifiedDossier.clientStatement.clientName);
                    setActiveTab("field_crew");
                  }}
                  className="px-3.5 py-2 bg-slate-800 text-white hover:bg-slate-900 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm"
                >
                  <HardHat className="w-3.5 h-3.5" />
                  <span>إصدار أمر عمل فوري</span>
                </button>
              </div>

              <button
                onClick={() => setSelectedDossierClient(null)}
                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold"
              >
                إغلاق
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================= */}
      {/* MODAL 2: ADD NEW CUSTOMER TO STATEMENT */}
      {/* ========================================================= */}
      {isAddCustomerModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
                <Plus className="w-4 h-4 text-emerald-700" />
                <span>إضافة عميل / مشروع جديد في بيان العملاء</span>
              </h3>
              <button onClick={() => setIsAddCustomerModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                ✕
              </button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">اسم العميل / المنشأة:</label>
                <input
                  type="text"
                  placeholder="مثال: شركة الفيصلية للمعارض والمؤتمرات"
                  value={newCustomerForm.clientName}
                  onChange={(e) => setNewCustomerForm({ ...newCustomerForm, clientName: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">المدينة:</label>
                  <select
                    value={newCustomerForm.city}
                    onChange={(e) => setNewCustomerForm({ ...newCustomerForm, city: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  >
                    <option value="الرياض">الرياض</option>
                    <option value="جدة">جدة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                  </select>
                </div>

                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">رقم الجوال:</label>
                  <input
                    type="text"
                    value={newCustomerForm.phone}
                    onChange={(e) => setNewCustomerForm({ ...newCustomerForm, phone: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">المبلغ الإجمالي (ر.س):</label>
                  <input
                    type="number"
                    value={newCustomerForm.amountSar}
                    onChange={(e) => setNewCustomerForm({ ...newCustomerForm, amountSar: Number(e.target.value) })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800 font-mono"
                  />
                </div>

                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">تاريخ التعاقد:</label>
                  <input
                    type="date"
                    value={newCustomerForm.date}
                    onChange={(e) => setNewCustomerForm({ ...newCustomerForm, date: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800 font-mono"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-600 mb-1 font-semibold">نوع العمل المنفذ:</label>
                <textarea
                  rows={2}
                  value={newCustomerForm.scopeOfWork}
                  onChange={(e) => setNewCustomerForm({ ...newCustomerForm, scopeOfWork: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">المتابعة الدورية بعد:</label>
                  <select
                    value={newCustomerForm.monthlyFollowupDays}
                    onChange={(e) => setNewCustomerForm({ ...newCustomerForm, monthlyFollowupDays: Number(e.target.value) })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  >
                    <option value={7}>7 أيام (عاجل)</option>
                    <option value={30}>30 يوماً (شهري قياسي)</option>
                    <option value={90}>90 يوماً (ربع سنوي)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">تجديد رخصة الدفاع المدني:</label>
                  <select
                    value={newCustomerForm.licenseRenewalDays}
                    onChange={(e) => setNewCustomerForm({ ...newCustomerForm, licenseRenewalDays: Number(e.target.value) })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  >
                    <option value={365}>بعد عام كامل</option>
                    <option value={30}>خلال 30 يوماً</option>
                    <option value={180}>بعد 6 أشهر</option>
                  </select>
                </div>
              </div>
            </div>

            <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
              <button
                onClick={() => setIsAddCustomerModalOpen(false)}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700"
              >
                إلغاء
              </button>
              <button
                onClick={handleAddNewCustomer}
                className="px-4 py-1.5 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold shadow-sm"
              >
                حفظ العميل ومزامنة الإدارات
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================= */}
      {/* MODAL 3: NEW DAILY REPORT */}
      {/* ========================================================= */}
      {isNewDailyReportModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
                <ClipboardList className="w-4 h-4 text-emerald-700" />
                <span>تسجيل تقرير ميداني يومي بالـ GPS</span>
              </h3>
              <button onClick={() => setIsNewDailyReportModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                ✕
              </button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">اسم المشروع / المنشأة:</label>
                <input
                  type="text"
                  value={newDailyReportForm.clientName}
                  onChange={(e) => setNewDailyReportForm({ ...newDailyReportForm, clientName: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">المشرف الهندسي:</label>
                  <input
                    type="text"
                    value={newDailyReportForm.supervisorName}
                    onChange={(e) => setNewDailyReportForm({ ...newDailyReportForm, supervisorName: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">الفني المكلف:</label>
                  <input
                    type="text"
                    value={newDailyReportForm.technicianName}
                    onChange={(e) => setNewDailyReportForm({ ...newDailyReportForm, technicianName: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-600 mb-1 font-semibold">الأعمال المنفذة:</label>
                <textarea
                  rows={2}
                  value={newDailyReportForm.scopeExecutedText}
                  onChange={(e) => setNewDailyReportForm({ ...newDailyReportForm, scopeExecutedText: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">ضغط الفحص الهيدروستاتيكي (PSI):</label>
                  <input
                    type="number"
                    value={newDailyReportForm.hydrostaticPressurePsi}
                    onChange={(e) => setNewDailyReportForm({ ...newDailyReportForm, hydrostaticPressurePsi: Number(e.target.value) })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs font-mono focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">مطابقة كود SBC 801:</label>
                  <select
                    value={newDailyReportForm.complianceStatus}
                    onChange={(e) =>
                      setNewDailyReportForm({
                        ...newDailyReportForm,
                        complianceStatus: e.target.value as DailyFieldReport["sbc801ComplianceStatus"]
                      })
                    }
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800 font-medium"
                  >
                    <option value="مطابق 100%">مطابق 100%</option>
                    <option value="ملاحظات طفيفة">ملاحظات طفيفة</option>
                    <option value="عدم مطابقة يستوجب معالجة">عدم مطابقة يستوجب معالجة</option>
                  </select>
                </div>
              </div>
            </div>

            <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
              <button
                onClick={() => setIsNewDailyReportModalOpen(false)}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700"
              >
                إلغاء
              </button>
              <button
                onClick={handleAddDailyReport}
                className="px-4 py-1.5 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold shadow-sm"
              >
                اعتماد التقرير وتحديث نسبة الإنجاز
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================= */}
      {/* MODAL 4: NEW FIELD WORK ORDER */}
      {/* ========================================================= */}
      {isNewWorkOrderModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
                <HardHat className="w-4 h-4 text-emerald-700" />
                <span>إصدار أمر عمل ميداني وتوجيه الفرق</span>
              </h3>
              <button onClick={() => setIsNewWorkOrderModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                ✕
              </button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">اسم العميل / المنشأة:</label>
                <select
                  value={newWorkOrderForm.clientName}
                  onChange={(e) => setNewWorkOrderForm({ ...newWorkOrderForm, clientName: e.target.value })}
                  className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800 font-medium"
                >
                  {customerStatements.map((c) => (
                    <option key={c.id} value={c.clientName}>
                      {c.clientName}
                    </option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">المدينة:</label>
                  <input
                    type="text"
                    value={newWorkOrderForm.city}
                    onChange={(e) => setNewWorkOrderForm({ ...newWorkOrderForm, city: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">الفني المكلف:</label>
                  <input
                    type="text"
                    value={newWorkOrderForm.technicianAssigned}
                    onChange={(e) => setNewWorkOrderForm({ ...newWorkOrderForm, technicianAssigned: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-600 mb-1 font-semibold">نوع أمر العمل:</label>
                <select
                  value={newWorkOrderForm.orderType}
                  onChange={(e) =>
                    setNewWorkOrderForm({
                      ...newWorkOrderForm,
                      orderType: e.target.value as FieldWorkOrder["orderType"]
                    })
                  }
                  className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2 text-xs focus:bg-white focus:ring-1 focus:ring-emerald-500 text-slate-800 font-medium"
                >
                  <option value="صيانة وقائية دورية">صيانة وقائية دورية</option>
                  <option value="تركيب وتنفيذ جديد">تركيب وتنفيذ جديد</option>
                  <option value="اختبار ضغط هيدروستاتيكي">اختبار ضغط هيدروستاتيكي</option>
                  <option value="إصلاح عطل طارئ">إصلاح عطل طارئ</option>
                  <option value="معاينة لإصدار رخصة">معاينة لإصدار رخصة</option>
                </select>
              </div>
            </div>

            <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
              <button
                onClick={() => setIsNewWorkOrderModalOpen(false)}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700"
              >
                إلغاء
              </button>
              <button
                onClick={handleAddWorkOrder}
                className="px-4 py-1.5 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold shadow-sm"
              >
                إصدار أمر العمل
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================= */}
      {/* MODAL 5: DETAILED SOP VIEWER */}
      {/* ========================================================= */}
      {selectedSOPModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-700 shadow-sm">
                  <BookOpen className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-xs font-bold text-emerald-700">{selectedSOPModal.code}</span>
                    <h3 className="text-base font-bold text-slate-900">{selectedSOPModal.title}</h3>
                    <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                      الإصدار {selectedSOPModal.version}
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    🏛️ الإدارة المسؤولة: {selectedSOPModal.departmentName} • تاريخ السريان: {selectedSOPModal.effectiveDate}
                  </p>
                </div>
              </div>

              <button
                onClick={() => setSelectedSOPModal(null)}
                className="p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-slate-600"
              >
                ✕
              </button>
            </div>

            {/* Purpose & Scope */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                <span className="font-bold text-slate-900 block">🎯 الغرض من الإجراء (Purpose):</span>
                <p className="text-slate-600 leading-relaxed">{selectedSOPModal.purpose}</p>
              </div>

              <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                <span className="font-bold text-slate-900 block">📌 نطاق التطبيق (Scope):</span>
                <p className="text-slate-600 leading-relaxed">{selectedSOPModal.scope}</p>
              </div>
            </div>

            {/* Regulatory References & Forms */}
            <div className="flex flex-wrap items-center justify-between gap-3 text-xs bg-emerald-50/60 p-3 rounded-xl border border-emerald-200/70">
              <div className="flex items-center gap-2">
                <span className="font-bold text-emerald-900">المراجع التنظيمية:</span>
                <div className="flex flex-wrap gap-1">
                  {selectedSOPModal.regulatoryReferences.map((ref, idx) => (
                    <span key={idx} className="bg-white px-2 py-0.5 rounded text-xs font-semibold text-emerald-800 border border-emerald-300">
                      {ref}
                    </span>
                  ))}
                </div>
              </div>

              <div className="flex items-center gap-2 font-mono">
                <span className="font-bold text-emerald-900">مدة SLA الكلية:</span>
                <span className="bg-white px-2 py-0.5 rounded text-xs font-bold text-emerald-800 border border-emerald-300">
                  {selectedSOPModal.slaTotalDays} أيام عمل
                </span>
              </div>
            </div>

            {/* Workflow Steps Table */}
            <div className="space-y-3">
              <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5">
                <Layers className="w-4 h-4 text-emerald-700" />
                <span>خطوات سير العمل التفصيلية (Standard Workflow Steps):</span>
              </h4>

              <div className="space-y-3">
                {selectedSOPModal.steps.map((st) => (
                  <div key={st.stepNumber} className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div className="flex items-center justify-between border-b border-slate-200/80 pb-2">
                      <div className="flex items-center gap-2 font-bold text-slate-900">
                        <span className="w-5 h-5 rounded-full bg-emerald-700 text-white flex items-center justify-center text-xs">
                          {st.stepNumber}
                        </span>
                        <span>{st.stepTitle}</span>
                      </div>
                      <div className="flex items-center gap-2 text-xs font-mono">
                        <span className="text-emerald-700 font-semibold">👤 {st.actor}</span>
                        <span>•</span>
                        <span className="text-slate-500">⏱️ {st.slaHours} ساعة</span>
                      </div>
                    </div>

                    <p className="text-slate-700 leading-relaxed font-medium">{st.actionDetails}</p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-1">
                      <div className="text-slate-500">
                        <span className="font-semibold text-slate-700">المدخلات:</span> {st.inputs}
                      </div>
                      <div className="text-emerald-800 font-medium">
                        <span className="font-semibold text-emerald-900">المخرجات:</span> {st.outputs}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Footer Actions */}
            <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-2 text-xs">
                <span className="font-bold text-slate-700">النماذج المعتمدة:</span>
                {selectedSOPModal.mandatoryForms.map((f, i) => (
                  <span key={i} className="px-2 py-0.5 bg-slate-100 rounded text-xs text-slate-700 border border-slate-200">
                    {f}
                  </span>
                ))}
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => {
                    toast({
                      title: "📄 تم تنزيل الدليل الإجرائي المعتمد",
                      description: `تم تصدير وثيقة (${selectedSOPModal.code}) بنجاح.`
                    });
                  }}
                  className="px-3.5 py-2 bg-emerald-700 text-white hover:bg-emerald-800 rounded-lg text-xs font-semibold shadow-sm flex items-center gap-1.5"
                >
                  <Download className="w-3.5 h-3.5" />
                  <span>تحميل الدليل PDF</span>
                </button>

                <button
                  onClick={() => setSelectedSOPModal(null)}
                  className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold"
                >
                  إغلاق
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================= */}
      {/* MODAL 6: DETAILED INTERNAL AUDIT WORKPAPER VIEWER */}
      {/* ========================================================= */}
      {selectedAuditProgramModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-700 shadow-sm">
                  <ClipboardCheck className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-xs font-bold text-emerald-700">{selectedAuditProgramModal.programNumber}</span>
                    <h3 className="text-base font-bold text-slate-900">{selectedAuditProgramModal.departmentName}</h3>
                    <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                      {selectedAuditProgramModal.overallAssuranceLevel}
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    المراجع المسؤول: {selectedAuditProgramModal.leadAuditor} • نطاق الفحص: {selectedAuditProgramModal.period}
                  </p>
                </div>
              </div>

              <button
                onClick={() => setSelectedAuditProgramModal(null)}
                className="p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-slate-600"
              >
                ✕
              </button>
            </div>

            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-1">
              <span className="font-bold text-slate-900 block">نطاق وهدف المراجعة:</span>
              <p className="text-slate-700 leading-relaxed">{selectedAuditProgramModal.auditScope}</p>
              <div className="pt-2 text-slate-500 font-mono text-xs">
                طريقة أخذ العينات: {selectedAuditProgramModal.samplingMethod}
              </div>
            </div>

            {/* Testing Procedures & Results */}
            <div className="space-y-3">
              <h4 className="font-bold text-xs text-slate-900">إجراءات الاختبار والنتائج الرقابية (Audit Testing Procedures):</h4>

              <div className="space-y-3">
                {selectedAuditProgramModal.testingSteps.map((step) => {
                  const isCompliant = step.result === "compliant";
                  return (
                    <div key={step.stepNumber} className="p-4 bg-white rounded-xl border border-slate-200 text-xs space-y-2 shadow-sm">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                        <span className="font-bold text-slate-900">
                          الإجراء {step.stepNumber}: {step.description}
                        </span>
                        <span
                          className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-bold border ${
                            isCompliant
                              ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                              : "bg-amber-50 text-amber-800 border-amber-200"
                          }`}
                        >
                          {isCompliant ? "مطابق تماماً" : "ملاحظة رقابية طفيفة"}
                        </span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-600">
                        <div>
                          <span className="font-semibold text-slate-700">الهدف الرقابي:</span> {step.controlObjective}
                        </div>
                        <div>
                          <span className="font-semibold text-slate-700">حجم العينة المفحوصة:</span> {step.sampleSize}
                        </div>
                      </div>

                      <div className="p-2.5 bg-slate-50 rounded-lg text-xs border border-slate-100">
                        <span className="font-semibold text-slate-800">نتيجة الفحص وملاحظات المراجع:</span>{" "}
                        <span className="text-slate-600">{step.notes}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
              <span className="text-xs text-slate-500 font-mono">
                معايير المعهد الدولي للمراجعين الداخليين IIA Standards
              </span>

              <button
                onClick={() => setSelectedAuditProgramModal(null)}
                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold"
              >
                إغلاق
              </button>
            </div>
          </div>
        </div>
      )}
            </div>
      </div>
    </div>
  );
}

  </script>
</body>
</html>
