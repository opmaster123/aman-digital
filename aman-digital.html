/* ========================================================= */
/* AMAN DIGITAL - SIDEBAR & WORKSPACE STYLES (RTL ACCURATE)  */
/* ========================================================= */
.aman-app-layout {
  display: flex !important;
  flex-direction: row !important;
  min-height: 100vh !important;
  width: 100% !important;
  background-color: hsl(var(--background)) !important;
  color: hsl(var(--foreground)) !important;
  direction: rtl !important;
}

.aman-sidebar {
  width: 280px !important;
  min-width: 280px !important;
  max-width: 280px !important;
  height: 100vh !important;
  position: sticky !important;
  top: 0 !important;
  right: 0 !important;
  background-color: hsl(var(--card)) !important;
  border-left: 1px solid hsl(var(--border)) !important;
  display: flex !important;
  flex-direction: column !important;
  z-index: 50 !important;
  flex-shrink: 0 !important;
  box-shadow: -4px 0 15px rgba(0, 0, 0, 0.03) !important;
  transition: width 0.2s ease, min-width 0.2s ease, transform 0.25s ease !important;
}

.aman-sidebar.collapsed {
  width: 76px !important;
  min-width: 76px !important;
  max-width: 76px !important;
}

.aman-main-content {
  flex: 1 1 0% !important;
  min-width: 0 !important;
  padding: 1.5rem !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 1.5rem !important;
  overflow-x: hidden !important;
}

.aman-nav-btn {
  display: flex !important;
  align-items: center !important;
  gap: 0.75rem !important;
  padding: 0.65rem 0.85rem !important;
  border-radius: 0.85rem !important;
  font-size: 0.75rem !important;
  font-weight: 700 !important;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
  cursor: pointer !important;
  text-align: right !important;
  width: 100% !important;
  border: 1px solid transparent !important;
  position: relative !important;
  text-decoration: none !important;
}

.aman-nav-btn:hover {
  background-color: hsl(var(--secondary)) !important;
  color: hsl(var(--foreground)) !important;
}

.aman-nav-btn.active {
  background: linear-gradient(135deg, #059669 0%, #0d9488 100%) !important;
  color: #ffffff !important;
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3) !important;
  border-color: rgba(5, 150, 105, 0.4) !important;
}

.aman-nav-btn.active svg {
  color: #ffffff !important;
}

.aman-nav-btn.active span {
  color: #ffffff !important;
}

.aman-collapse-btn {
  display: flex !important;
}

.aman-close-btn {
  display: none !important;
}

.aman-menu-btn {
  display: none !important;
}

@media (max-width: 1023px) {
  .aman-sidebar {
    position: fixed !important;
    transform: translateX(100%) !important;
  }
  .aman-sidebar.mobile-open {
    transform: translateX(0) !important;
  }
  .aman-backdrop {
    position: fixed !important;
    inset: 0 !important;
    background-color: rgba(15, 23, 42, 0.55) !important;
    backdrop-filter: blur(4px) !important;
    z-index: 49 !important;
  }
  .aman-collapse-btn {
    display: none !important;
  }
  .aman-close-btn {
    display: flex !important;
  }
  .aman-menu-btn {
    display: flex !important;
  }
}

.custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 9999px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }

  </style>

export default function AmanDigital() {
  const [searchParams, setSearchParams] = useSearchParams();
  const urlTab = searchParams.get("tab") as AmanDigitalTab | null;

  const [activeTab, setActiveTab] = useState<AmanDigitalTab>(
    urlTab && VALID_TABS.includes(urlTab) ? urlTab : "dashboard"
  );
  const [sidebarCollapsed, setSidebarCollapsed] = useState<boolean>(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState<boolean>(false);

  useEffect(() => {
    if (urlTab && VALID_TABS.includes(urlTab) && urlTab !== activeTab) {
      setActiveTab(urlTab);
    }
  }, [urlTab, activeTab]);

  const handleTabChange = (tab: AmanDigitalTab) => {
    setActiveTab(tab);
    setSearchParams({ tab });
  };

  // State: Unified Relational Data
  const [clients, setClients] = useState<ClientRecord[]>(INITIAL_CLIENTS);
  const [tickets, setTickets] = useState<ServiceTicket[]>(INITIAL_TICKETS);
  const [technicians, setTechnicians] = useState<TechnicianRecord[]>(INITIAL_TECHNICIANS);
  const [auditLogs, setAuditLogs] = useState<AuditLogEntry[]>(INITIAL_AUDIT_LOGS);

  // Filters State
  const [searchQuery, setSearchQuery] = useState<string>("");
  const [selectedCity, setSelectedCity] = useState<string>("all");
  const [selectedFollowupFilter, setSelectedFollowupFilter] = useState<string>("all");

  // Zero-Silos Drill-Down State (360° Client Dossier & Ticket Inspector)
  const [selectedClientIdForDossier, setSelectedClientIdForDossier] = useState<string | null>(null);
  const [dossierSubTab, setDossierSubTab] = useState<"overview" | "contracts" | "tickets" | "systems" | "reports" | "comms">("overview");
  const [selectedTicketIdForDetails, setSelectedTicketIdForDetails] = useState<string | null>(null);

  // Interactive Reports Center Selection
  const [selectedReportClientId, setSelectedReportClientId] = useState<string>(INITIAL_CLIENTS[0].id);

  // Modal / Form States
  const [isAddClientOpen, setIsAddClientOpen] = useState<boolean>(false);
  const [newClientName, setNewClientName] = useState("");
  const [newClientActivity, setNewClientActivity] = useState("مباني تجارية وإدارية");
  const [newClientCity, setNewClientCity] = useState<ClientRecord["city"]>("الرياض");
  const [newClientMobile, setNewClientMobile] = useState("");
  const [newClientContractType, setNewClientContractType] = useState<ClientRecord["contractType"]>("عقد صيانة دوري");
  const [newClientValue, setNewClientValue] = useState<number>(45000);
  const [newClientCR, setNewClientCR] = useState("");

  // New Service Ticket State
  const [isAddTicketOpen, setIsAddTicketOpen] = useState<boolean>(false);
  const [ticketClientId, setTicketClientId] = useState(INITIAL_CLIENTS[0].id);
  const [ticketServiceType, setTicketServiceType] = useState<ServiceTicket["serviceType"]>("صيانة مضخات الحريق");
  const [ticketPriority, setTicketPriority] = useState<ServiceTicket["priority"]>("عادي");
  const [ticketTechId, setTicketTechId] = useState(INITIAL_TECHNICIANS[0].id);
  const [ticketDate, setTicketDate] = useState("2026-09-17");
  const [ticketTime, setTicketTime] = useState("10:00 صباحاً");
  const [ticketNotes, setTicketNotes] = useState("");

  // Quick report upload simulator
  const [activeReportTicketId, setActiveReportTicketId] = useState<string | null>(null);
  const [reportSafetyNotes, setReportSafetyNotes] = useState("تم فحص محابس التحكم ومستوى الضغط وجميعها مطابقة لكود SBC 801.");

  // Calculated Metrics
  const filteredClients = useMemo(() => {
    return clients.filter((c) => {
      const matchCity = selectedCity === "all" || c.city === selectedCity;
      const matchFollowup =
        selectedFollowupFilter === "all" || c.monthlyFollowupStatus === selectedFollowupFilter;
      const matchQuery =
        searchQuery.trim() === "" ||
        c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        c.mobile.includes(searchQuery) ||
        c.invoiceNumber.toLowerCase().includes(searchQuery.toLowerCase()) ||
        c.activityType.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCity && matchFollowup && matchQuery;
    });
  }, [clients, selectedCity, selectedFollowupFilter, searchQuery]);

  const totalContractValue = useMemo(() => {
    return clients.reduce((sum, c) => sum + c.contractValueSar, 0);
  }, [clients]);

  const expiringLicensesCount = useMemo(() => {
    return clients.filter((c) => c.licenseStatus === "قارب على الانتهاء").length;
  }, [clients]);

  const dueFollowupsCount = useMemo(() => {
    return clients.filter(

              </button>
              <button
                onClick={() => setDossierSubTab("contracts")}
                className={cn(
                  "px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer whitespace-nowrap",
                  dossierSubTab === "contracts" ? "bg-card text-foreground shadow-xs font-black" : "text-muted-foreground hover:text-foreground"
                )}
              >
                العقد والمالية
              </button>
              <button
                onClick={() => setDossierSubTab("tickets")}
                className={cn(
                  "px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer whitespace-nowrap",
                  dossierSubTab === "tickets" ? "bg-card text-foreground shadow-xs font-black" : "text-muted-foreground hover:text-foreground"
                )}
              >
                أوامر العمل والزيارات ({tickets.filter(t => t.clientId === selectedDossierClient.id).length})
              </button>
              <button
                onClick={() => setDossierSubTab("systems")}
                className={cn(
                  "px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer whitespace-nowrap",
                  dossierSubTab === "systems" ? "bg-card text-foreground shadow-xs font-black" : "text-muted-foreground hover:text-foreground"
                )}
              >
                أنظمة السلامة المفحوصة
              </button>
            </div>

            {/* Dossier Content */}
            {dossierSubTab === "overview" && (
              <div className="space-y-4 text-xs">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div className="p-3 bg-secondary/40 rounded-xl border border-border space-y-1">
                    <span className="text-[10px] text-muted-foreground font-bold">حالة رخصة الدفاع المدني:</span>
                    <p className="font-bold text-foreground">{selectedDossierClient.licenseStatus}</p>
                    <span className="font-mono text-[10px] text-muted-foreground block">انتهاء: {selectedDossierClient.licenseExpiryDate}</span>
                  </div>

                  <div className="p-3 bg-secondary/40 rounded-xl border border-border space-y-1">
                    <span className="text-[10px] text-muted-foreground font-bold">نسبة الامتثال العام:</span>
                    <span className="font-mono font-black text-emerald-800 text-sm block">{selectedDossierClient.complianceRate}%</span>
                    <Progress value={selectedDossierClient.complianceRate} className="h-1.5 bg-card mt-1" />
                  </div>

                  <div className="p-3 bg-secondary/40 rounded-xl border border-border space-y-1">
                    <span className="text-[10px] text-muted-foreground font-bold">المتابعة الدورية:</span>
                    <p className="font-bold text-foreground">{selectedDossierClient.monthlyFollowupStatus}</p>
                    <span className="text-[10px] text-muted-foreground block">المشرف: {selectedDossierClient.assignedEngineer}</span>
                  </div>
                </div>

                <div className="p-4 bg-secondary/30 rounded-xl border border-border space-y-2">
                  <span className="font-bold text-foreground block">بيانات الاتصال والعنوان:</span>
                  <p className="text-muted-foreground">• الجوال: <span className="font-mono text-foreground font-bold">{selectedDossierClient.mobile}</span></p>
                  <p className="text-muted-foreground">• البريد الإلكتروني: <span className="font-mono text-foreground">{selectedDossierClient.email}</span></p>
                  <p className="text-muted-foreground">• العنوان الميداني: {selectedDossierClient.address}</p>
                </div>
              </div>
            )}

            {dossierSubTab === "contracts" && (
              <div className="space-y-3 text-xs">
                <div className="p-4 bg-secondary/40 rounded-xl border border-border space-y-2">
                  <div className="flex items-center justify-between border-b border-border/50 pb-2">
                    <span className="font-bold text-foreground">نوع العقد: {selectedDossierClient.contractType}</span>
                    <span className="font-mono font-black text-sm text-foreground">{selectedDossierClient.contractValueSar.toLocaleString()} ريال</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-muted-foreground">
                    <p>تاريخ البداية: <span className="font-mono text-foreground">{selectedDossierClient.contractStartDate}</span></p>
                    <p>تاريخ الانتهاء: <span className="font-mono text-foreground">{selectedDossierClient.contractEndDate}</span></p>
                    <p>رقم الفاتورة: <span className="font-mono text-foreground">{selectedDossierClient.invoiceNumber}</span></p>
                    <p>حالة السداد: <span className="text-emerald-700 font-bold">مدفوعة بالكامل ✓</span></p>
                  </div>
                </div>
              </div>
            )}

            {dossierSubTab === "tickets" && (
              <div className="space-y-2.5 text-xs">
                {tickets.filter(t => t.clientId === selectedDossierClient.id).map(ticket => (
                  <div key={ticket.id} className="p-3 bg-secondary/40 rounded-xl border border-border flex items-center justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-mono font-bold text-emerald-800">{ticket.id}</span>
                        <strong className="text-foreground">{ticket.serviceType}</strong>
                      </div>
                      <span className="text-[10px] text-muted-foreground block">
                        الفني: {ticket.technicianName} | الموعد: {ticket.scheduledDate}
                      </span>
                    </div>
                    <Badge variant="outline">{ticket.stage}</Badge>
                  </div>
                ))}
              </div>
            )}

            {dossierSubTab === "systems" && (
              <div className="space-y-2 text-xs">
                {selectedDossierClient.fireSystems.map(sys => (
                  <div key={sys.id} className="p-3 bg-secondary/40 rounded-xl border border-border flex items-center justify-between">
                    <div>
                      <strong className="text-foreground block">{sys.name}</strong>
                      <span className="text-[10px] text-muted-foreground font-mono">الكود: {sys.codeStandard} | {sys.notes}</span>
                    </div>
                    <Badge className="bg-emerald-500/15 text-emerald-800 border-emerald-500/30 text-[10px]">
                      {sys.status}
                    </Badge>
                  </div>
                ))}
              </div>
            )}

            <div className="flex items-center justify-between pt-3 border-t border-border">
              <button
                onClick={() => handleJumpToClientInReports(selectedDossierClient.id)}
                className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-black hover:scale-105 transition-all cursor-pointer flex items-center gap-1.5"
              >
                <FileText className="h-3.5 w-3.5" />
                عرض تقرير وشهادة السلامة SBC 801
              </button>

              <button
                onClick={() => setSelectedClientIdForDossier(null)}
                className="px-4 py-2 rounded-xl bg-secondary text-foreground text-xs font-bold hover:bg-card cursor-pointer"
              >
                إغلاق
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: ADD CLIENT & CONTRACT */}
      {isAddClientOpen && (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-card w-full max-w-xl rounded-3xl border border-border p-6 sm:p-8 shadow-2xl space-y-4 animate-in zoom-in-95 duration-200">
            <div className="flex items-center justify-between border-b border-border pb-3">
              <h3 className="text-base font-black text-foreground flex items-center gap-2">
                <Building2 className="h-5 w-5 text-emerald-600" />
                تسجيل عميل وعقد سلامة جديد
              </h3>
              <button
                onClick={() => setIsAddClientOpen(false)}
                className="text-muted-foreground hover:text-foreground text-sm font-bold cursor-pointer"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleCreateClient} className="space-y-3.5 text-xs">
              <div className="space-y-1">
                <label className="font-bold text-foreground">اسم المنشأة أو العميل:</label>
                <input
                  type="text"
                  required
                  value={newClientName}
                  onChange={(e) => setNewClientName(e.target.value)}
                  placeholder="مثال: شركة البرج الطبية المحدودة..."
                  className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label className="font-bold text-foreground">نوع النشاط:</label>
                  <input
                    type="text"
                    value={newClientActivity}
                    onChange={(e) => setNewClientActivity(e.target.value)}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground focus:outline-hidden"
                  />
                </div>

                <div className="space-y-1">
                  <label className="font-bold text-foreground">المدينة:</label>
                  <select
                    value={newClientCity}
                    onChange={(e) => setNewClientCity(e.target.value as any)}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                  >
                    <option value="الرياض">الرياض</option>
                    <option value="جدة">جدة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="الخبر">الخبر</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="المدينة المنورة">المدينة المنورة</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label className="font-bold text-foreground">رقم الجوال:</label>
                  <input
                    type="tel"
                    value={newClientMobile}
                    onChange={(e) => setNewClientMobile(e.target.value)}
                    placeholder="05xxxxxxxx"
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 font-mono text-foreground focus:outline-hidden"
                  />
                </div>

                <div className="space-y-1">
                  <label className="font-bold text-foreground">السجل التجاري (CR):</label>
                  <input
                    type="text"
                    value={newClientCR}
                    onChange={(e) => setNewClientCR(e.target.value)}
                    placeholder="1010xxxxxx"
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 font-mono text-foreground focus:outline-hidden"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label className="font-bold text-foreground">نوع العقد:</label>
                  <select
                    value={newClientContractType}
                    onChange={(e) => setNewClientContractType(e.target.value as any)}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                  >
                    <option value="عقد صيانة دوري">عقد صيانة دوري</option>
                    <option value="توريد وتركيب">توريد وتركيب</option>
                    <option value="استخراج رخصة سلامة">استخراج رخصة سلامة</option>
                    <option value="شامل متكامل">شامل متكامل</option>
                  </select>
                </div>

                <div className="space-y-1">
                  <label className="font-bold text-foreground">قيمة العقد السنوية (ريال):</label>
                  <input
                    type="number"
                    value={newClientValue}
                    onChange={(e) => setNewClientValue(Number(e.target.value))}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 font-mono text-foreground font-bold focus:outline-hidden"
                  />
                </div>
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                <button
                  type="button"
                  onClick={() => setIsAddClientOpen(false)}
                  className="px-4 py-2 rounded-xl bg-secondary text-foreground text-xs font-bold hover:bg-card cursor-pointer"
                >
                  إلغاء
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-black hover:scale-[1.02] cursor-pointer shadow-xs"
                >
                  حفظ وتسجيل العميل
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL: CREATE SERVICE TICKET */}
      {isAddTicketOpen && (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-card w-full max-w-lg rounded-3xl border border-border p-6 sm:p-8 shadow-2xl space-y-4 animate-in zoom-in-95 duration-200">
            <div className="flex items-center justify-between border-b border-border pb-3">
              <h3 className="text-base font-black text-foreground flex items-center gap-2">
                <Wrench className="h-5 w-5 text-emerald-600" />
                إنشاء أمر عمل وتكليف فني ميداني
              </h3>
              <button
                onClick={() => setIsAddTicketOpen(false)}
                className="text-muted-foreground hover:text-foreground text-sm font-bold cursor-pointer"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleCreateTicket} className="space-y-3.5 text-xs">
              <div className="space-y-1">
                <label className="font-bold text-foreground">العميل المستهدف:</label>
                <select
                  value={ticketClientId}
                  onChange={(e) => setTicketClientId(e.target.value)}
                  className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                >
                  {clients.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.name} ({c.city})
                    </option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label className="font-bold text-foreground">نوع الزيارة / الخدمة:</label>
                  <select
                    value={ticketServiceType}
                    onChange={(e) => setTicketServiceType(e.target.value as any)}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                  >
                    <option value="صيانة مضخات الحريق">صيانة مضخات الحريق</option>
                    <option value="فحص لوحة الإنذار FACP">فحص لوحة الإنذار FACP</option>
                    <option value="اختبار شبكة الرشاشات">اختبار شبكة الرشاشات</option>
                    <option value="فحص وإعادة تعبئة مطافئ">فحص وإعادة تعبئة مطافئ</option>
                    <option value="معاينة لإصدار رخصة سلامة">معاينة لإصدار رخصة سلامة</option>
                  </select>
                </div>

                <div className="space-y-1">
                  <label className="font-bold text-foreground">درجة الأهمية:</label>
                  <select
                    value={ticketPriority}
                    onChange={(e) => setTicketPriority(e.target.value as any)}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                  >
                    <option value="عادي">عادي</option>
                    <option value="عالي">عالي (متابعة مستحقة)</option>
                    <option value="طوارئ قصوى">طوارئ قصوى (عطل مفاجئ)</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="space-y-1">
                  <label className="font-bold text-foreground">الفني المكلف:</label>
                  <select
                    value={ticketTechId}
                    onChange={(e) => setTicketTechId(e.target.value)}
                    className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground font-bold focus:outline-hidden"
                  >
                    {technicians.map((t) => (
                      <option key={t.id} value={t.id}>
                        {t.name} ({t.assignedCity})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="space-y-1">
                  <label className="font-bold text-foreground">تاريخ ووقت الموعد:</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={ticketDate}
                      onChange={(e) => setTicketDate(e.target.value)}
                      className="w-full bg-secondary border border-border rounded-xl p-2.5 font-mono text-foreground focus:outline-hidden text-center"
                    />
                    <input
                      type="text"
                      value={ticketTime}
                      onChange={(e) => setTicketTime(e.target.value)}
                      className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground focus:outline-hidden text-center"
                    />
                  </div>
                </div>
              </div>

              <div className="space-y-1">
                <label className="font-bold text-foreground">تعليمات وملاحظات الزيارة:</label>
                <textarea
                  rows={3}
                  value={ticketNotes}
                  onChange={(e) => setTicketNotes(e.target.value)}
                  placeholder="اكتب تعليمات خاصة للفني أو نقاط فحص معينة..."
                  className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground focus:outline-hidden"
                />
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                <button
                  type="button"
                  onClick={() => setIsAddTicketOpen(false)}
                  className="px-4 py-2 rounded-xl bg-secondary text-foreground text-xs font-bold hover:bg-card cursor-pointer"
                >
                  إلغاء
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-black hover:scale-[1.02] cursor-pointer shadow-xs"
                >
                  تأكيد وتكليف الفني
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL: SUBMIT FIELD INSPECTION REPORT */}
      {activeReportTicketId && (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-card w-full max-w-lg rounded-3xl border border-border p-6 sm:p-8 shadow-2xl space-y-4 animate-in zoom-in-95 duration-200">
            <div className="flex items-center justify-between border-b border-border pb-3">
              <h3 className="text-base font-black text-foreground flex items-center gap-2">
                <FileCheck className="h-5 w-5 text-emerald-600" />
                اعتماد التقرير الميداني وإصدار محضر السلامة
              </h3>
              <button
                onClick={() => setActiveReportTicketId(null)}
                className="text-muted-foreground hover:text-foreground text-sm font-bold cursor-pointer"
              >
                ✕
              </button>
            </div>

            <div className="space-y-3.5 text-xs">
              <p className="text-muted-foreground leading-relaxed">
                أمر العمل: <strong className="text-foreground font-mono">{activeReportTicketId}</strong>
              </p>

              <div className="p-3 bg-secondary/50 rounded-xl border border-border space-y-1.5">
                <span className="font-bold text-emerald-800 block">✓ فحص الضوابط الهندسية لكود SBC 801:</span>
                <p className="text-[11px] text-muted-foreground">• اختبار ضغط شبكة الرشاشات: 140 PSI (مطابق).</p>
                <p className="text-[11px] text-muted-foreground">• فحص عمل مفاتيح تدفق المياه وإشارات الإنذار: تم بنجاح.</p>
                <p className="text-[11px] text-muted-foreground">• خلو مسارات الطوارئ ومخارج الهروب: تم التحقق ميدانياً.</p>
              </div>

              <div className="space-y-1">
                <label className="font-bold text-foreground">ملاحظات مهندس السلامة والاعتماد:</label>
                <textarea
                  rows={3}
                  value={reportSafetyNotes}
                  onChange={(e) => setReportSafetyNotes(e.target.value)}
                  className="w-full bg-secondary border border-border rounded-xl p-2.5 text-foreground focus:outline-hidden"
                />
              </div>

              <div className="flex items-center justify-between p-3 bg-emerald-500/10 rounded-xl border border-emerald-500/25">
                <span className="font-bold text-emerald-800 text-[11px]">التوقيع الإلكتروني للمهندس المعتمد:</span>
                <span className="font-mono font-bold text-foreground text-[10px]">VERIFIED_DIGITAL_SIG ✓</span>
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                <button
                  onClick={() => setActiveReportTicketId(null)}
                  className="px-4 py-2 rounded-xl bg-secondary text-foreground text-xs font-bold hover:bg-card cursor-pointer"
                >
                  إلغاء
                </button>
                <button
                  onClick={() => handleSubmitFieldReport(activeReportTicketId)}
                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-black hover:scale-[1.02] cursor-pointer shadow-xs"
                >
                  اعتماد التقرير وتحديث حالة الامتثال
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

  </script>
</body>
</html>
