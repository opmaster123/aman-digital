/* ========================================================= */
/* AMAN DIGITAL - SIDEBAR & WORKSPACE STYLES (RTL ACCURATE)  */
/* ========================================================= */
.aman-app-layout {
  display: flex !important;
  flex-direction: row !important;
  min-height: 100vh !important;
  width: 100% !important;
  background-color: hsl(var(--background)) !important;
  color: hsl(var(--foreground)) !important;
  direction: rtl !important;
}

.aman-sidebar {
  width: 280px !important;
  min-width: 280px !important;
  max-width: 280px !important;
  height: 100vh !important;
  position: sticky !important;
  top: 0 !important;
  right: 0 !important;
  background-color: hsl(var(--card)) !important;
  border-left: 1px solid hsl(var(--border)) !important;
  display: flex !important;
  flex-direction: column !important;
  z-index: 50 !important;
  flex-shrink: 0 !important;
  box-shadow: -4px 0 15px rgba(0, 0, 0, 0.03) !important;
  transition: width 0.2s ease, min-width 0.2s ease, transform 0.25s ease !important;
}

.aman-sidebar.collapsed {
  width: 76px !important;
  min-width: 76px !important;
  max-width: 76px !important;
}

.aman-main-content {
  flex: 1 1 0% !important;
  min-width: 0 !important;
  padding: 1.5rem !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 1.5rem !important;
  overflow-x: hidden !important;
}

.aman-nav-btn {
  display: flex !important;
  align-items: center !important;
  gap: 0.75rem !important;
  padding: 0.65rem 0.85rem !important;
  border-radius: 0.85rem !important;
  font-size: 0.75rem !important;
  font-weight: 700 !important;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
  cursor: pointer !important;
  text-align: right !important;
  width: 100% !important;
  border: 1px solid transparent !important;
  position: relative !important;
  text-decoration: none !important;
}

.aman-nav-btn:hover {
  background-color: hsl(var(--secondary)) !important;
  color: hsl(var(--foreground)) !important;
}

.aman-nav-btn.active {
  background: linear-gradient(135deg, #059669 0%, #0d9488 100%) !important;
  color: #ffffff !important;
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3) !important;
  border-color: rgba(5, 150, 105, 0.4) !important;
}

.aman-nav-btn.active svg {
  color: #ffffff !important;
}

.aman-nav-btn.active span {
  color: #ffffff !important;
}

.aman-collapse-btn {
  display: flex !important;
}

.aman-close-btn {
  display: none !important;
}

.aman-menu-btn {
  display: none !important;
}

@media (max-width: 1023px) {
  .aman-sidebar {
    position: fixed !important;
    transform: translateX(100%) !important;
  }
  .aman-sidebar.mobile-open {
    transform: translateX(0) !important;
  }
  .aman-backdrop {
    position: fixed !important;
    inset: 0 !important;
    background-color: rgba(15, 23, 42, 0.55) !important;
    backdrop-filter: blur(4px) !important;
    z-index: 49 !important;
  }
  .aman-collapse-btn {
    display: none !important;
  }
  .aman-close-btn {
    display: flex !important;
  }
  .aman-menu-btn {
    display: flex !important;
  }
}

.custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 9999px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }

  


/* ==========================================================================
   PRINT OPTIMIZATION FOR OFFICIAL SBC 801 CERTIFICATE & CIVIL DEFENSE REPORTS
   ========================================================================== */
@media print {
  body {
    background: white !important;
    color: black !important;
  }
  .no-print,
  .aman-sidebar,
  header,
  nav,
  button,
  input,
  select,
  .no-print-area,
  .toast-container,
  .aman-toast-container,
  .mobile-bottom-nav {
    display: none !important;
  }
  .printable-certificate {
    display: block !important;
    border: 2px solid #047857 !important;
    border-radius: 16px !important;
    padding: 24px !important;
    background: white !important;
    color: black !important;
    box-shadow: none !important;
    page-break-inside: avoid;
    width: 100% !important;
    max-width: 100% !important;
  }
}

/* ==========================================================================
   MOBILE & RESPONSIVE DESIGN SYSTEM (PHONES, TABLETS & DESKTOPS)
   ========================================================================== */

/* Prevent iOS Safari auto-zoom on input focus */
@media (max-width: 767px) {
  input, select, textarea {
    font-size: 15px !important;
  }
}

/* Base mobile tap highlight reset */
* {
  -webkit-tap-highlight-color: transparent;
}

/* Floating Toast Notification Stack */
.aman-toast-container {
  position: fixed !important;
  bottom: 1.5rem !important;
  left: 1.5rem !important;
  right: auto !important;
  top: auto !important;
  z-index: 99999 !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 0.75rem !important;
  max-width: 26rem !important;
  width: calc(100% - 3rem) !important;
  pointer-events: none !important;
}

@keyframes toastSlideUpBottom {
  from {
    opacity: 0;
    transform: translateY(1.5rem) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.aman-toast-item {
  animation: toastSlideUpBottom 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Mobile Screens (<1024px) */
@media (max-width: 1023px) {
  .aman-sidebar {
    position: fixed !important;
    top: 0 !important;
    bottom: 0 !important;
    right: 0 !important;
    width: 290px !important;
    max-width: 85vw !important;
    z-index: 9999 !important;
    transform: translateX(105%) !important;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    box-shadow: -10px 0 35px rgba(0, 0, 0, 0.35) !important;
    background-color: hsl(var(--card)) !important;
  }
  .aman-sidebar.sidebar-open {
    transform: translateX(0) !important;
  }

  /* Padding at bottom of main to avoid bottom nav overlap on phones */
  main {
    padding-bottom: 6rem !important;
  }

  /* Toast notification above mobile bottom bar */
  .aman-toast-container {
    bottom: 5.25rem !important;
    left: 1rem !important;
    right: 1rem !important;
    width: auto !important;
    max-width: calc(100vw - 2rem) !important;
  }
}

/* Desktop Screens (>=1024px) */
@media (min-width: 1024px) {
  .aman-sidebar {
    position: static !important;
    transform: none !important;
    box-shadow: none !important;
  }
  .mobile-bottom-nav {
    display: none !important;
  }
}

/* Responsive Display & Breakpoint Utilities */
@media (max-width: 639px) {
  .sm\:hidden { display: none !important; }
}

@media (min-width: 640px) {

// ARCHITECTURE: ZUSTAND IN-MEMORY DATABASE WITH LOCALSTORAGE PERSISTENCE
// ZERO INITIAL DUMMY DATA - 100% PERSISTENT AND FUNCTIONALLY COMPLETE
// ============================================================================

const { useState, useMemo, useEffect, useRef, useSyncExternalStore } = React;

// ----------------------------------------------------------------------------
// 1. ZUSTAND ENGINE WITH LOCALSTORAGE PERSISTENCE
// ----------------------------------------------------------------------------
const Zustand = (function() {
  const createStore = (createState) => {
    let state;
    const listeners = new Set();
    const setState = (partial, replace) => {
      const nextState = typeof partial === 'function' ? partial(state) : partial;
      if (!Object.is(nextState, state)) {
        const previousState = state;
        state = (replace ?? (typeof nextState !== 'object' || nextState === null))
          ? nextState
          : Object.assign({}, state, nextState);
        listeners.forEach((listener) => listener(state, previousState));
      }
    };
    const getState = () => state;
    const subscribe = (listener) => {
      listeners.add(listener);
      return () => listeners.delete(listener);
    };
    const destroy = () => listeners.clear();
    const api = { setState, getState, subscribe, destroy };
    state = createState(setState, getState, api);
    return api;
  };

  const create = (createState) => {
    const api = typeof createState === 'function' ? createStore(createState) : createState;
    const useBoundStore = (selector = (s) => s) => {
      return useSyncExternalStore(
        api.subscribe,
        () => selector(api.getState()),
        () => selector(api.getState())
      );
    };
    Object.assign(useBoundStore, api);
    return useBoundStore;
  };

  const persist = (config, options = {}) => (set, get, api) => {
    const name = options.name || 'demo-db';
    const storage = options.storage || localStorage;

    const setAndPersist = (partial, replace) => {
      set(partial, replace);
      try {
        const curState = get();
        const toSave = {
          clients: curState.clients || [],
          technicians: curState.technicians || [],
          tickets: curState.tickets || [],
          auditLogs: curState.auditLogs || [],
          activeTab: curState.activeTab || 'dashboard'
        };
        storage.setItem(name, JSON.stringify(toSave));
      } catch (err) {
        console.error('Zustand persist error:', err);
      }
    };

    const initial = config(setAndPersist, get, api);

    try {
      const raw = storage.getItem(name);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          return Object.assign({}, initial, {
            clients: Array.isArray(parsed.clients) ? parsed.clients : [],
            technicians: Array.isArray(parsed.technicians) ? parsed.technicians : [],
            tickets: Array.isArray(parsed.tickets) ? parsed.tickets : [],
            auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : [],
            activeTab: parsed.activeTab || 'dashboard'
          });
        }
      }
    } catch (e) {
      console.warn('Hydration error from localStorage:', e);
    }

    return initial;
  };

  return { create, persist };
})();

window.Zustand = Zustand;

const calculateComplianceRate = (systems = []) => {
  if (!systems || systems.length === 0) return 100;
  const compliantCount = systems.filter(s => s.status === "مطابق 100%").length;
  const minorCount = systems.filter(s => s.status === "ملاحظات طفيفة").length;
  const totalWeight = compliantCount + (minorCount * 0.7);
  return Math.round((totalWeight / systems.length) * 100);
};

const getNowTimeString = () => {
  const now = new Date();
  let hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, '0');
  const period = hours >= 12 ? 'مساءً' : 'صباحاً';
  hours = hours % 12 || 12;
  return `${hours}:${minutes} ${period}`;
};

const exportToCsvFile = (filename, headers, rows) => {
  const csvContent = "\uFEFF" + [
    headers.map(h => `"${h}"`).join(','),
    ...rows.map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
  ].join('\r\n');

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

        set(state => {
          const oldTicket = state.tickets.find(t => t.id === id);
          if (!oldTicket) return { isLoading: false };

          const updatedTicket = { ...oldTicket, ...updates };

          let updatedTechnicians = state.technicians;
          if (updates.technicianId && updates.technicianId !== oldTicket.technicianId) {
            const newTech = state.technicians.find(t => t.id === updates.technicianId);
            if (newTech) {
              updatedTicket.technicianName = newTech.name;
              updatedTicket.technicianPhone = newTech.phone;
              updatedTicket.gpsLocation = newTech.currentGps;
            }
            updatedTechnicians = state.technicians.map(t => {
              if (t.id === oldTicket.technicianId) return { ...t, totalAssignedToday: Math.max(0, t.totalAssignedToday - 1) };
              if (t.id === updates.technicianId) return { ...t, totalAssignedToday: t.totalAssignedToday + 1, activeTicketId: id };
              return t;
            });
          }

          const log = {
            id: 'LOG-' + Date.now(),
            timestamp: getNowTimeString(),
            category: 'أوامر عمل',
            action: `تحديث تفاصيل أمر العمل (${updatedTicket.id})`,
            clientName: updatedTicket.clientName,
            clientId: updatedTicket.clientId,
            actor: 'مشرف العمليات',
            status: 'نجاح'
          };

          return {
            tickets: state.tickets.map(t => t.id === id ? updatedTicket : t),
            technicians: updatedTechnicians,
            auditLogs: [log, ...state.auditLogs],
            isEditTicketOpen: false,
            editingTicketId: null,
            isLoading: false
          };
        });

        get().addToast('تم حفظ تعديلات أمر العمل بنجاح!', 'success');
      },

      updateTicketStage: async (ticketId, newStage) => {
        set({ isLoading: true });
        await simulateApiLatency(250);

        set(state => {
          const ticket = state.tickets.find(t => t.id === ticketId);
          if (!ticket) return { isLoading: false };

          const updatedTicket = { ...ticket, stage: newStage };

          let updatedTechnicians = state.technicians;
          if (ticket.technicianId) {
            if (newStage === "قيد التنفيذ") {
              updatedTechnicians = state.technicians.map(t => t.id === ticket.technicianId ? { ...t, status: 'ميداني نشط' } : t);
            } else if (newStage === "مكتمل ومعتمد") {
              updatedTechnicians = state.technicians.map(t => t.id === ticket.technicianId ? {
                ...t,
                status: 'اكتملت المهام',
                completedToday: t.completedToday + 1
              } : t);
              updatedTicket.reportSubmitted = true;
              updatedTicket.reportDate = new Date().toISOString().split('T')[0];
            }
          }

          let updatedClients = state.clients;
          if (newStage === "مكتمل ومعتمد") {
            updatedClients = state.clients.map(c => c.id === ticket.clientId ? {
              ...c,
              monthlyFollowupStatus: 'مكتمل هذا الشهر',
              complianceRate: Math.max(c.complianceRate, 95)
            } : c);
          }

          const log = {
            id: 'LOG-' + Date.now(),
            timestamp: getNowTimeString(),
            category: 'أوامر عمل',
            action: `تغيير مرحلة أمر العمل (${ticket.id}) إلى: ${newStage}`,
            clientName: ticket.clientName,
            clientId: ticket.clientId,
            actor: 'نظام التدفق الآلي (Workflow Engine)',
            status: newStage === 'مكتمل ومعتمد' ? 'معتمد' : 'تنبيه'

          return {
            tickets: state.tickets.map(t => t.id === ticketId ? updatedTicket : t),
            technicians: updatedTechnicians,
            clients: updatedClients,
            auditLogs: [log, ...state.auditLogs],
            isLoading: false

      exportBackupJson: () => {
        const state = get();
        const backupData = {
          version: '2.0.0',
          exportedAt: new Date().toISOString(),
          tables: {
            clients: state.clients,
            technicians: state.technicians,
            tickets: state.tickets,
            auditLogs: state.auditLogs
          }
        };

        const jsonStr = JSON.stringify(backupData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `aman-digital-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        get().addToast('تم تحميل ملف النسخة الاحتياطية JSON بنجاح!', 'success');
      },

      importBackupJson: (jsonString) => {
        try {
          const parsed = JSON.parse(jsonString);
          const tables = parsed.tables || parsed;
          if (!tables || typeof tables !== 'object') {
            throw new Error('الملف لا يحتوي على هيكل بيانات صحيح');
          }

          set({
            clients: Array.isArray(tables.clients) ? tables.clients : [],
            technicians: Array.isArray(tables.technicians) ? tables.technicians : [],
            tickets: Array.isArray(tables.tickets) ? tables.tickets : [],
            auditLogs: Array.isArray(tables.auditLogs) ? tables.auditLogs : [],
            isDatabaseToolsOpen: false
          });

          get().addToast('تمت استعادة قاعدة البيانات والنسخة الاحتياطية بنجاح!', 'success');
        } catch (err) {
          get().addToast('فشل استيراد الملف: ' + err.message, 'error');
        }
      },

// ----------------------------------------------------------------------------
// 5. TOAST NOTIFICATION CONTAINER (STRICTLY BOTTOM-LEFT POSITIONED)
// ----------------------------------------------------------------------------
function ToastContainer() {
  const toasts = useAppStore(state => state.toasts);
  const removeToast = useAppStore(state => state.removeToast);

  if (!toasts || toasts.length === 0) return null;

  return (
    <div
      className="aman-toast-container"
      style={{
        position: 'fixed',
        zIndex: 99999,
        display: 'flex',
        flexDirection: 'column',
        gap: '0.75rem',
        pointerEvents: 'none'
      }}
    >
      {toasts.map(toast => {
        let bg = 'bg-slate-900 text-white border-slate-700';
        let icon = <CheckCircle2 className="h-5 w-5 text-emerald-400 shrink-0" />;
        if (toast.type === 'error') {
          bg = 'bg-rose-950 text-rose-50 border-rose-800';
          icon = <XCircle className="h-5 w-5 text-rose-400 shrink-0" />;
        } else if (toast.type === 'info') {
          bg = 'bg-blue-950 text-blue-50 border-blue-800';
          icon = <Info className="h-5 w-5 text-blue-400 shrink-0" />;
        } else if (toast.type === 'warning') {
          bg = 'bg-amber-950 text-amber-50 border-amber-800';
          icon = <AlertTriangle className="h-5 w-5 text-amber-400 shrink-0" />;
        }

        return (
          <div
            key={toast.id}
            className={`aman-toast-item pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-md transition-all duration-300 ${bg}`}
            style={{
              boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.25)'
            }}
          >
            <div className="flex items-center gap-3 min-w-0">
              {icon}
              <span className="text-xs sm:text-sm font-semibold truncate">{toast.message}</span>
            </div>
            <button
              onClick={() => removeToast(toast.id)}
              className="p-1.5 rounded-lg hover:bg-white/10 text-white/70 hover:text-white transition-colors shrink-0"
            >
              <X className="h-4 w-4" />
            </button>
          </div>
        );
      })}
    </div>
  );
}

        return (
          <button
            key={item.id}
            onClick={() => {
              if (item.isMenuToggle) {
                setMobileMenuOpen(true);
              } else {
                setActiveTab(item.id);
              }
            }}
            className={`relative flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all ${
              isActive ? 'text-primary font-bold' : 'text-muted-foreground hover:text-foreground font-medium'
            }`}
          >
            <div className="relative">
              <IconComp className={`h-5 w-5 transition-transform ${isActive ? 'scale-110 text-primary' : ''}`} />
              {item.badge && (
                <span className="absolute -top-1.5 -right-2 h-4 w-4 rounded-full bg-emerald-600 text-white font-mono text-[9px] font-bold flex items-center justify-center shadow-xs">
                  {item.badge}
                </span>
              )}
            </div>
            <span className="text-[10px] mt-0.5 leading-tight">{item.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

                              title="فتح موقع GPS الفعلي على خرائط جوجل"
                            >
                              <MapPin className="h-3 w-3" />
                              خرائط Google
                            </a>
                          )}
                        </div>
                      </div>

                      {/* Notes snippet */}
                      {ticket.notes && (
                        <p className="text-[11px] text-muted-foreground italic line-clamp-2">
                          "{ticket.notes}"
                        </p>
                      )}

                      {/* Action Bar */}
                      <div className="pt-2 border-t border-border/60 flex items-center justify-between gap-1.5">
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => {
                              setEditingTicketId(ticket.id);
                              setIsEditTicketOpen(true);
                            }}
                            className="p-1.5 rounded-lg hover:bg-secondary text-muted-foreground hover:text-foreground transition-colors"
                            title="تعديل أمر العمل والجدولة"
                          >
                            <Edit className="h-3.5 w-3.5" />
                          </button>
                          <button
                            onClick={() => {
                              if (confirm(`هل أنت متأكد من إلغاء أمر العمل (${ticket.id})؟`)) {
                                deleteTicket(ticket.id);
                              }
                            }}
                            className="p-1.5 rounded-lg hover:bg-rose-50 text-muted-foreground hover:text-rose-600 transition-colors"
                            title="إلغاء وحذف أمر العمل"
                          >
                            <Trash2 className="h-3.5 w-3.5" />
                          </button>
                        </div>

                        {/* Stage Advancement Controls */}
                        {ticket.stage === 'مجدول' && (
                          <button
                            onClick={() => updateTicketStage(ticket.id, 'قيد التنفيذ')}
                            className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-xs hover:bg-blue-700 transition-all"
                          >
                            <span>بدء التنفيذ</span>
                            <ChevronLeft className="h-3 w-3" />
                          </button>
                        )}
                        {ticket.stage === 'قيد التنفيذ' && (
                          <button
                            onClick={() => setActiveReportTicketId(ticket.id)}
                            className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-xs hover:bg-emerald-700 transition-all"
                          >
                            <CheckSquare className="h-3 w-3" />
                            <span>رفع التقرير والاعتماد</span>
                          </button>
                        )}
                        {ticket.stage === 'مكتمل ومعتمد' && (
                          <span className="text-[11px] font-bold text-emerald-700 flex items-center gap-1">
                            <CheckCircle2 className="h-3.5 w-3.5" />
                            موثق بالشهادة
                          </span>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

              >
                <Trash2 className="h-3.5 w-3.5" />
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ----------------------------------------------------------------------------
function ReportsTab() {
  const clients = useAppStore(state => state.clients);
  const selectedReportClientId = useAppStore(state => state.selectedReportClientId);
  const setSelectedReportClientId = useAppStore(state => state.setSelectedReportClientId);
  const exportClientsToCsv = useAppStore(state => state.exportClientsToCsv);
  const seedDemoData = useAppStore(state => state.seedDemoData);

  const selectedClient = clients.find(c => c.id === selectedReportClientId) || clients[0] || null;

  if (!selectedClient) {
    return (
      <EmptyStateWidget

function NotificationsTab() {
  const clients = useAppStore(state => state.clients);

  const setSelectedFollowupFilter = useAppStore(state => state.setSelectedFollowupFilter);

  const setSelectedClientIdForDossier = useAppStore(state => state.setSelectedClientIdForDossier);

  const filtered = clients.filter(c => {
    if (selectedFollowupFilter === 'all') return true;

  });

  const handleSimulateWhatsApp = (client) => {

        secondaryActionText="تعبئة بيانات تجريبية سريعة"

  return (

            <button
              key={filterKey}

              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${

                  {client.monthlyFollowupStatus}

                <span className="text-xs font-mono text-muted-foreground">{client.city}</span>

              <h3 className="font-black text-base text-foreground">{client.name}</h3>

                <Wrench className="h-4 w-4" />

              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AddClientModal() {
  const isAddClientOpen = useAppStore(state => state.isAddClientOpen);
  const setIsAddClientOpen = useAppStore(state => state.setIsAddClientOpen);
  const addClient = useAppStore(state => state.addClient);
  const technicians = useAppStore(state => state.technicians);

  const [name, setName] = useState('');
  const [activityType, setActivityType] = useState('مباني تجارية وإدارية');
  const [crNumber, setCrNumber] = useState('');
  const [city, setCity] = useState('الرياض');
  const [address, setAddress] = useState('');
  const [mobile, setMobile] = useState('');
  const [contractType, setContractType] = useState('عقد صيانة دوري');
  const [contractValueSar, setContractValueSar] = useState(45000);
  const [licenseExpiryDate, setLicenseExpiryDate] = useState(
    new Date(Date.now() + 365*24*3600*1000).toISOString().split('T')[0]
  );

  if (!isAddClientOpen) return null;

      name,
      activityType,
      crNumber: crNumber || `1010${Math.floor(100000 + Math.random() * 900000)}`,
      city,
      address,
      mobile: mobile || '0500000000',

              </div>
              <div className="bg-secondary/40 p-3.5 rounded-2xl border border-border/60">
                <span className="text-muted-foreground text-[10px] block">قيمة العقد السنوي</span>
                <span className="font-bold text-foreground text-sm font-mono block mt-0.5">{(Number(client.contractValueSar) || 0).toLocaleString()} ر.س</span>
                <span className="text-[10px] text-muted-foreground block mt-0.5">{client.contractType}</span>
              </div>
            </div>

            <div className="bg-secondary/30 rounded-2xl p-4 border border-border/60 space-y-2">
              <h4 className="font-bold text-foreground">بيانات التواصل والموقع</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-muted-foreground">
                <div>العنوان: <span className="text-foreground font-semibold">{client.address || client.city}</span></div>
                <div>رقم الجوال: <span className="text-foreground font-semibold font-mono">{client.mobile}</span></div>
                <div>البريد الإلكتروني: <span className="text-foreground font-semibold font-mono">{client.email}</span></div>
                <div>رقم الفاتورة: <span className="text-foreground font-semibold font-mono">{client.invoiceNumber}</span></div>
              </div>
            </div>
          </div>
        )}

        {/* Sub-Tab 2: Fire Safety Systems Checklist */}
        {dossierSubTab === 'systems' && (
          <div className="space-y-4 text-xs">
            <div className="flex items-center justify-between">
              <span className="font-bold text-foreground">قائمة التجهيزات والأنظمة المعتمدة للمنشأة</span>
              <button
                onClick={() => setIsAddingSystem(!isAddingSystem)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-primary text-primary-foreground text-xs font-bold"
              >
                <Plus className="h-3.5 w-3.5" />
                إضافة نظام سلامة
              </button>
            </div>

            {/* Add System inline form */}
            {isAddingSystem && (
              <form onSubmit={handleAddSystemSubmit} className="bg-secondary/60 p-4 rounded-2xl border border-border space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <label className="font-bold text-foreground">اسم النظام / التجهيز *</label>
                    <input
                      type="text"
                      required
                      placeholder="مثال: شبكة رشاشات الرغوة AFFF"
                      value={newSysName}
                      onChange={(e) => setNewSysName(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-card border border-border text-xs"
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="font-bold text-foreground">المعيار المعتمد</label>
                    <input
                      type="text"
                      value={newSysStandard}
                      onChange={(e) => setNewSysStandard(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-card border border-border text-xs font-mono"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <label className="font-bold text-foreground">حالة النظام الفنية</label>
                    <select
                      value={newSysStatus}
                      onChange={(e) => setNewSysStatus(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-card border border-border text-xs"
                    >
                      <option value="مطابق 100%">مطابق 100%</option>
                      <option value="ملاحظات طفيفة">ملاحظات طفيفة</option>
                      <option value="غير مطابق - يتطلب إصلاح عاجل">غير مطابق - يتطلب إصلاح عاجل</option>
                    </select>
                  </div>
                  <div className="space-y-1">
                    <label className="font-bold text-foreground">ملاحظات الفحص</label>
                    <input
                      type="text"
                      placeholder="ملاحظات فنية..."
                      value={newSysNotes}
                      onChange={(e) => setNewSysNotes(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-card border border-border text-xs"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsAddingSystem(false)}
                    className="px-3 py-1.5 rounded-lg bg-card text-foreground font-bold"
                  >
                    إلغاء
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-1.5 rounded-lg bg-primary text-primary-foreground font-bold"
                  >
                    حفظ النظام
                  </button>
                </div>
              </form>
            )}

            {/* Systems list */}
            {(client.fireSystems || []).length === 0 ? (
              <div className="text-center py-6 text-muted-foreground border border-dashed border-border rounded-xl">
                لم تتم إضافة أي أنظمة سلامة لهذه المنشأة بعد.
              </div>
            ) : (
              <div className="space-y-2.5">
                {(client.fireSystems || []).map(sys => (
                  <div key={sys.id} className="bg-secondary/40 p-3.5 rounded-2xl border border-border flex items-center justify-between gap-3">
                    <div className="space-y-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-foreground text-xs">{sys.name}</span>
                        <span className="text-[10px] text-muted-foreground font-mono bg-card px-2 py-0.5 rounded border border-border">
                          {sys.codeStandard}
                        </span>
                      </div>
                      <p className="text-[11px] text-muted-foreground">{sys.notes || 'لا توجد ملاحظات مسجلة'}</p>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      {/* Inline Status Switcher */}
                      <select
                        value={sys.status}
                        onChange={(e) => updateFireSystemStatus(client.id, sys.id, e.target.value)}
                        className={`px-2.5 py-1 rounded-xl text-[10px] font-bold border focus:outline-none cursor-pointer ${
                          sys.status === 'مطابق 100%' ? 'bg-emerald-500/10 text-emerald-800 border-emerald-500/30' :
                          sys.status === 'ملاحظات طفيفة' ? 'bg-amber-500/10 text-amber-800 border-amber-500/30' :
                          'bg-rose-500/10 text-rose-800 border-rose-500/30'
                        }`}
                        title="تغيير نتيجة الفحص الفني فوراً وتحديث نسبة الامتثال تلقائياً"
                      >
                        <option value="مطابق 100%">مطابق 100%</option>
                        <option value="ملاحظات طفيفة">ملاحظات طفيفة</option>
                        <option value="غير مطابق - يتطلب إصلاح عاجل">غير مطابق - يتطلب إصلاح عاجل</option>
                      </select>

                      <button
                        onClick={() => deleteFireSystem(client.id, sys.id)}
                        className="p-1 rounded-lg text-muted-foreground hover:bg-rose-50 hover:text-rose-600 transition-colors"
                        title="حذف هذا النظام"
                      >
                        <Trash2 className="h-3.5 w-3.5" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Sub-Tab 3: Tickets History */}
        {dossierSubTab === 'tickets' && (
          <div className="space-y-3 text-xs">
            {clientTickets.length === 0 ? (
              <div className="text-center py-6 text-muted-foreground border border-dashed border-border rounded-xl">
                لا توجد أوامر عمل مجدولة لهذه المنشأة.
              </div>
            ) : (
              clientTickets.map(t => (
                <div key={t.id} className="bg-secondary/40 p-3 rounded-2xl border border-border flex items-center justify-between gap-3">
                  <div>
                    <span className="font-mono font-bold text-primary block">{t.id} - {t.serviceType}</span>
                    <span className="text-[11px] text-muted-foreground">الفني: {t.technicianName} • التاريخ: {t.scheduledDate}</span>
                  </div>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                    t.stage === 'مكتمل ومعتمد' ? 'bg-emerald-500/10 text-emerald-800' : 'bg-blue-500/10 text-blue-800'
                  }`}>
                    {t.stage}
                  </span>
                </div>
              ))
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ----------------------------------------------------------------------------
// 21. MODAL 6: DATABASE TOOLS & PERSISTENCE CONTROL (أدوات قاعدة البيانات)
// ----------------------------------------------------------------------------
function DatabaseToolsModal() {
  const isDatabaseToolsOpen = useAppStore(state => state.isDatabaseToolsOpen);
  const setIsDatabaseToolsOpen = useAppStore(state => state.setIsDatabaseToolsOpen);
  const clients = useAppStore(state => state.clients);
  const technicians = useAppStore(state => state.technicians);
  const tickets = useAppStore(state => state.tickets);
  const auditLogs = useAppStore(state => state.auditLogs);
  const resetDatabase = useAppStore(state => state.resetDatabase);
  const exportBackupJson = useAppStore(state => state.exportBackupJson);
  const importBackupJson = useAppStore(state => state.importBackupJson);
  const seedDemoData = useAppStore(state => state.seedDemoData);

  const fileInputRef = useRef(null);

  if (!isDatabaseToolsOpen) return null;

  const handleFileUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const content = event.target.result;
      if (typeof content === 'string') {
        importBackupJson(content);
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs overflow-y-auto">
      <div className="bg-card rounded-3xl border border-border p-6 shadow-2xl max-w-lg w-full space-y-5 animate-scale-up">
        <div className="flex items-center justify-between pb-3 border-b border-border">
          <div className="flex items-center gap-2">
            <Database className="h-5 w-5 text-emerald-600" />
            <h3 className="font-black text-base text-foreground">إدارة قاعدة البيانات المحلية (Zustand In-Memory)</h3>
          </div>
          <button
            onClick={() => setIsDatabaseToolsOpen(false)}
            className="p-1.5 rounded-lg hover:bg-secondary text-muted-foreground hover:text-foreground"
          >
            <X className="h-4 w-4" />
          </button>
        </div>

        {/* Database Status Info */}
        <div className="bg-secondary/50 rounded-2xl p-4 border border-border text-xs space-y-2">
          <div className="flex items-center justify-between text-muted-foreground">
            <span>مفتاح التخزين في المتصفح:</span>
            <span className="font-mono font-bold text-foreground">localStorage['demo-db']</span>
          </div>
          <div className="grid grid-cols-4 gap-2 pt-1 font-mono text-center">
            <div className="bg-card p-2 rounded-xl border border-border">
              <span className="text-[10px] text-muted-foreground block font-sans">المنشآت</span>
              <span className="font-bold text-foreground text-sm">{clients.length}</span>
            </div>
            <div className="bg-card p-2 rounded-xl border border-border">
              <span className="text-[10px] text-muted-foreground block font-sans">الفنيين</span>
              <span className="font-bold text-foreground text-sm">{technicians.length}</span>
            </div>
            <div className="bg-card p-2 rounded-xl border border-border">
              <span className="text-[10px] text-muted-foreground block font-sans">أوامر العمل</span>
              <span className="font-bold text-foreground text-sm">{tickets.length}</span>
            </div>
            <div className="bg-card p-2 rounded-xl border border-border">
              <span className="text-[10px] text-muted-foreground block font-sans">سجلات التدقيق</span>
              <span className="font-bold text-foreground text-sm">{auditLogs.length}</span>
            </div>
          </div>
        </div>

        {/* Action Buttons */}
        <div className="space-y-3 text-xs">
          <div className="flex flex-col sm:flex-row gap-3">
            <button
              onClick={exportBackupJson}
              className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-secondary hover:bg-secondary/80 text-foreground font-bold border border-border transition-all"
            >
              <Download className="h-4 w-4 text-emerald-600" />
              تصدير نسخة احتياطية (JSON)
            </button>

            <button
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-secondary hover:bg-secondary/80 text-foreground font-bold border border-border transition-all"
            >
              <Upload className="h-4 w-4 text-blue-600" />
              استيراد نسخة (JSON)
            </button>
            <input
              type="file"
              ref={fileInputRef}
              onChange={handleFileUpload}
              accept=".json"
              className="hidden"
            />
          </div>

          <button
            onClick={seedDemoData}
            className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-800 font-bold border border-emerald-500/30 transition-all"
          >
            <Sparkles className="h-4 w-4 text-amber-500" />
            تعبئة بيانات تجريبية نموذجية سريعة (3 منشآت و3 فنيين)
          </button>

          <button
            onClick={() => {
              if (confirm('تحذير: هل أنت متأكد من مسح جميع المنشآت والفنيين وأوامر العمل وتصفير قاعدة البيانات بالكامل؟')) {
                resetDatabase();
              }
            }}
            className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-700 font-bold border border-rose-500/30 transition-all"
          >
            <Trash2 className="h-4 w-4 text-rose-600" />
            مسح وتصفير قاعدة البيانات بالكامل (Reset)
          </button>
        </div>
      </div>
    </div>
  );
}



// ----------------------------------------------------------------------------
// 22. ROOT APPLICATION CONTROLLER (APP)
// ----------------------------------------------------------------------------
function App() {
  const activeTab = useAppStore(state => state.activeTab);

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col lg:flex-row antialiased font-['IBM_Plex_Sans_Arabic',sans-serif] selection:bg-emerald-500 selection:text-white">
      {/* Toast Notification Container */}
      <ToastContainer />

      {/* Responsive Collapsible Sidebar */}
      <Sidebar />

      {/* Main Content Area */}
      <div className="flex-1 flex flex-col min-w-0">
        <Header />

        <main className="flex-1 p-3.5 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto pb-24 lg:pb-8">
          {activeTab === 'dashboard' && <DashboardTab />}
          {activeTab === 'workflow' && <WorkflowTab />}
          {activeTab === 'clients_contracts' && <ClientsTab />}
          {activeTab === 'technicians_daily' && <TechniciansTab />}
          {activeTab === 'reports_export' && <ReportsTab />}
          {activeTab === 'notifications_reminders' && <NotificationsTab />}
          {activeTab === 'audit_logs' && <AuditLogsTab />}
        </main>
      </div>

      {/* Mobile Bottom Navigation Bar (Phones/Tablets <1024px) */}
      <MobileBottomNav />

      {/* Global Modals (Rendered conditionally via Store state) */}
      <AddClientModal />
      <EditClientModal />
      <AddTechnicianModal />
      <EditTechnicianModal />
      <AddTicketModal />
      <EditTicketModal />
      <FieldReportModal />
      <ClientDossierModal />
      <DatabaseToolsModal />
    </div>
  );
}

// ----------------------------------------------------------------------------
// 23. APPLICATION MOUNT (REACT 18 ROOT)
// ----------------------------------------------------------------------------
const container = document.getElementById('root');
if (container) {
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
}

  </script>
</body>
